<ng-container *transloco="let t; read: 'todos.priorityButton'">
  <ng-template #priorityMenu>
    <div hlmDropdownMenu class="todo-priority-menu">
      <button
        hlmDropdownMenuItem
        type="button"
        class="high-priority"
        (triggered)="setPriority(priorities.HIGH)"
      >
        <ng-icon name="lucideChevronUp" />
        {{ t("highPriority") }}
      </button>
      <button
        hlmDropdownMenuItem
        type="button"
        class="medium-priority"
        (triggered)="setPriority(priorities.MEDIUM)"
      >
        <ng-icon name="lucideChevronRight" />
        {{ t("mediumPriority") }}
      </button>
      <button
        hlmDropdownMenuItem
        type="button"
        class="low-priority"
        (triggered)="setPriority(priorities.LOW)"
      >
        <ng-icon name="lucideChevronDown" />
        {{ t("lowPriority") }}
      </button>
    </div>
  </ng-template>
  @if (todo.priority === priorities.MEDIUM) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      class="medium-priority"
      [disabled]="readOnly"
      [hlmDropdownMenuTrigger]="priorityMenu"
    >
      <ng-icon name="lucideCircle" />
      {{ t("mediumPriority") }}
    </button>
  }
  @if (todo.priority === priorities.LOW) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      class="low-priority"
      [disabled]="readOnly"
      [hlmDropdownMenuTrigger]="priorityMenu"
    >
      <ng-icon name="lucideChevronDown" />
      {{ t("lowPriority") }}
    </button>
  }
  @if (todo.priority === priorities.HIGH) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      class="high-priority"
      [disabled]="readOnly"
      [hlmDropdownMenuTrigger]="priorityMenu"
    >
      <ng-icon name="lucideChevronUp" />
      {{ t("highPriority") }}
    </button>
  }
</ng-container>
