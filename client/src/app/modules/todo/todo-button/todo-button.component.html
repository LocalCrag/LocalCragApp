<ng-container *transloco="let t; read: 'todoButton'">
  @if (!isTodo) {
    <span class="todo-add" [class.todo-add-labeled]="showLabel">
      <p-button
        styleClass="p-button-rounded p-button-text p-button-secondary todo-button"
        data-cy="todo-button"
        [label]="showLabel ? t('addTodo') : undefined"
        [ariaLabel]="t('addTodo')"
        (click)="addWithPriority($event, priorities.MEDIUM)"
        [disabled]="saving"
        [ngClass]="{ 'hide-label': !showLabel }"
      >
        <ng-template #icon>
          <i class="pi pi-plus"></i>
        </ng-template>
      </p-button>
      <p-menu
        #menu
        [model]="priorityItems"
        [popup]="true"
        appendTo="body"
        styleClass="todo-add-priority-menu"
      ></p-menu>
      <p-button
        styleClass="p-button-rounded p-button-text p-button-secondary todo-priority-trigger"
        data-cy="todo-priority-menu"
        [ariaLabel]="t('choosePriority')"
        icon="pi pi-chevron-down"
        (click)="openPriorityMenu($event, menu)"
        [disabled]="saving"
      ></p-button>
    </span>
  } @else {
    <p-button
      styleClass="p-button-rounded p-button-text p-button-secondary todo-button"
      data-cy="todo-button"
      label="{{ showLabel ? t('onTodoList') : '' }}"
      [ariaLabel]="t('onTodoList')"
      (click)="addWithPriority($event, priorities.MEDIUM)"
      [ngClass]="{ 'hide-label': !showLabel }"
    >
      <ng-template #icon>
        <i class="pi pi-plus is-todo-icon"></i>
      </ng-template>
    </p-button>
  }
</ng-container>
