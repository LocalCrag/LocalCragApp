<ng-container *transloco="let t; read: 'todoButton'">
  @if (!isTodo) {
    <span class="todo-add" [class.todo-add-labeled]="showLabel">
      <button
        hlmBtn
        type="button"
        variant="ghost"
        [size]="showLabel ? 'default' : 'icon'"
        class="todo-button rounded-full"
        data-cy="todo-button"
        [attr.aria-label]="t('addTodo')"
        (click)="addWithPriority($event, priorities.MEDIUM)"
        [disabled]="saving"
      >
        <ng-icon name="lucidePlus" />
        @if (showLabel) {
          {{ t("addTodo") }}
        }
      </button>
      <button
        hlmBtn
        type="button"
        variant="ghost"
        [size]="showLabel ? 'icon-sm' : 'icon'"
        class="todo-priority-trigger rounded-full"
        data-cy="todo-priority-menu"
        [attr.aria-label]="t('choosePriority')"
        [disabled]="saving"
        [hlmDropdownMenuTrigger]="priorityMenu"
      >
        <ng-icon name="lucideChevronDown" />
      </button>
      <ng-template #priorityMenu>
        <div hlmDropdownMenu class="todo-add-priority-menu">
          <button
            hlmDropdownMenuItem
            type="button"
            id="todo-priority-high"
            class="high-priority"
            (triggered)="addWithPriority(null, priorities.HIGH)"
          >
            <ng-icon name="lucideChevronUp" />
            {{ "todos.priorityButton.highPriority" | transloco }}
          </button>
          <button
            hlmDropdownMenuItem
            type="button"
            id="todo-priority-medium"
            class="medium-priority"
            (triggered)="addWithPriority(null, priorities.MEDIUM)"
          >
            <ng-icon name="lucideChevronRight" />
            {{ "todos.priorityButton.mediumPriority" | transloco }}
          </button>
          <button
            hlmDropdownMenuItem
            type="button"
            id="todo-priority-low"
            class="low-priority"
            (triggered)="addWithPriority(null, priorities.LOW)"
          >
            <ng-icon name="lucideChevronDown" />
            {{ "todos.priorityButton.lowPriority" | transloco }}
          </button>
        </div>
      </ng-template>
    </span>
  } @else {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      [size]="showLabel ? 'default' : 'icon'"
      class="todo-button rounded-full"
      data-cy="todo-button"
      [attr.aria-label]="t('onTodoList')"
      (click)="addWithPriority($event, priorities.MEDIUM)"
    >
      <ng-icon name="lucidePlus" class="is-todo-icon" />
      @if (showLabel) {
        {{ t("onTodoList") }}
      }
    </button>
  }
</ng-container>
