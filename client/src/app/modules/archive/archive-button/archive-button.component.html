<ng-container *isGymMode="true">
  <ng-container *transloco="let t; read: 'archiveButton'">
    <!-- eslint-disable @angular-eslint/template/eqeqeq -->
    <button
      hlmBtn
      type="button"
      class="archive-button"
      [variant]="style == 'outline' ? 'outline' : 'ghost'"
      [size]="!showLabel ? 'icon' : style == 'outline' ? 'sm' : 'default'"
      [class.rounded-full]="style == 'plain' || style == 'rounded'"
      data-cy="archive-button"
      (click)="toggleArchived($event)"
      [ngClass]="{ 'hide-label': !showLabel }"
    >
      @if (!getCurrentState()) {
        <ng-icon name="lucideHammer" />
      }
      @if (getCurrentState()) {
        <ng-icon name="lucideUndo2" />
      }
      @if (showLabel) {
        {{ !getCurrentState() ? t("archive") : t("unarchive") }}
      }
    </button>
  </ng-container>
  <hlm-alert-dialog #archiveDialog>
    <hlm-alert-dialog-content *hlmAlertDialogPortal class="sm:max-w-md">
      <div hlmAlertDialogHeader>
        <h2 hlmAlertDialogTitle>{{ confirmMessage }}</h2>
      </div>
      <div hlmAlertDialogFooter>
        <button
          hlmBtn
          type="button"
          variant="outline"
          (click)="rejectConfirm()"
        >
          {{ rejectLabel }}
        </button>
        <button hlmBtn type="button" (click)="acceptConfirm()">
          {{ acceptLabel }}
        </button>
      </div>
    </hlm-alert-dialog-content>
  </hlm-alert-dialog>
</ng-container>
