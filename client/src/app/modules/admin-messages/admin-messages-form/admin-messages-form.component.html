<ng-container *transloco="let t; read: 'adminMessages.form'">
  <div class="content p-6">
    <form [formGroup]="adminMessageForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="title">{{ t("titleLabel") }}</label>
        <input
          type="text"
          pInputText
          id="title"
          formControlName="title"
          placeholder="{{ t('titlePlaceholder') }}"
          lcFormControl
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 200 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="text">{{ t("textLabel") }}</label>
        <textarea
          pTextarea
          id="text"
          formControlName="text"
          rows="8"
          placeholder="{{ t('textPlaceholder') }}"
          lcFormControl
        ></textarea>
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 10000 }
        }}</small>
      </div>
    </form>

    <div class="form-actions">
      <p-button
        label="{{
          editMode
            ? t('editAdminMessageButtonLabel')
            : t('createAdminMessageButtonLabel')
        }}"
        (click)="saveAdminMessage()"
        icon="pi pi-save"
        class="responsive-button"
        [loading]="loadingState === loadingStates.LOADING"
      ></p-button>
      <p-button
        label="{{ t('cancelButtonLabel') }}"
        (click)="cancel()"
        class="responsive-button"
        styleClass="p-button-secondary"
        icon="pi pi-ban"
      ></p-button>
      @if (editMode) {
        <p-button
          label="{{ t('deleteAdminMessageButtonLabel') }}"
          (click)="confirmDeleteAdminMessage($event)"
          icon="pi pi-trash"
          class="responsive-button"
          styleClass="p-button-danger"
          [loading]="loadingState === loadingStates.LOADING"
        ></p-button>
      }
      <p-confirmpopup></p-confirmpopup>
    </div>
  </div>
</ng-container>
