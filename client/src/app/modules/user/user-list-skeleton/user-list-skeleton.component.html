<div class="user-list-skeleton">
  @for (i of Array.from({ length: 10 }); track $index) {
    <div class="user-list-skeleton__row">
      <div
        hlmSkeleton
        class="shrink-0"
        style="width: 2.5rem; height: 2.5rem; border-radius: 9999px"
      ></div>
      <div class="user-list-skeleton__identity">
        <div hlmSkeleton style="width: 10rem; height: 1rem"></div>
        <div hlmSkeleton style="width: 14rem; height: 0.75rem"></div>
      </div>
      <div class="user-list-skeleton__meta">
        <div hlmSkeleton style="width: 12rem; height: 0.75rem"></div>
      </div>
      <div
        hlmSkeleton
        style="width: 5rem; height: 1.5rem; border-radius: 1rem"
      ></div>
      <div hlmSkeleton style="width: 4rem; height: 2rem"></div>
    </div>
  }
</div>
