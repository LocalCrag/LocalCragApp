@if (user) {
  <lc-ascent-list [user]="user"></lc-ascent-list>
}

@if (!user) {
  @for (i of Array.from({ length: 10 }); track $index) {
    <div class="flex mb-2">
      <div
        hlmSkeleton
        class="mr-2 shrink-0"
        style="width: 4rem; height: 4rem; border-radius: 9999px"
      ></div>
      <div style="flex: 1">
        <div hlmSkeleton class="mb-2" style="width: 100%; height: 1rem"></div>
        <div hlmSkeleton style="width: 75%; height: 1rem"></div>
      </div>
    </div>
  }
}
