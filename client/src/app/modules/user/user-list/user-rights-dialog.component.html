<ng-container *transloco="let t; read: 'users.rightsDialog'">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="user-role">{{ t('role') }}</label>
      <p-select
        inputId="user-role"
        [options]="roleOptions"
        [(ngModel)]="selectedRole"
        optionLabel="label"
        optionValue="value"
        appendTo="body"
        styleClass="w-full"
      />
      <p class="text-sm text-surface-500 m-0">
        <span class="font-medium">{{ selectedRoleLabel }}:</span>
        {{ roleHint }}
      </p>
    </div>
    @if (showSuggestionRight) {
      <div class="flex items-center gap-2">
        <p-checkbox
          inputId="allow-suggestions"
          [(ngModel)]="suggestionsEnabled"
          [binary]="true"
        />
        <label for="allow-suggestions" class="cursor-pointer">{{
          t('allowSuggestions')
        }}</label>
      </div>
    }
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <p-button [label]="t('cancel')" [text]="true" (click)="close()" />
    <p-button [label]="t('save')" [loading]="saving" (click)="save()" />
  </div>
</ng-container>
