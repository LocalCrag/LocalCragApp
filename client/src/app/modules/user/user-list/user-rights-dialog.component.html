<ng-container *transloco="let t; read: 'users.rightsDialog'">
  <div class="flex flex-col gap-4">
    <div class="flex flex-col gap-2">
      <label for="user-role">{{ t("role") }}</label>
      <hlm-select [(ngModel)]="selectedRole" [itemToString]="roleOptionLabel"><hlm-select-trigger class="w-full" id="user-role"><hlm-select-value /></hlm-select-trigger><hlm-select-content *hlmSelectPortal>@for (option of roleOptions; track $index) {<hlm-select-item [value]="option.value">{{ option.label }}</hlm-select-item>}</hlm-select-content></hlm-select>
      <p class="text-sm text-surface-500 m-0">
        <span class="font-medium">{{ selectedRoleLabel }}:</span>
        {{ roleHint }}
      </p>
    </div>
    @if (showSuggestionRight) {
      <div class="flex items-center gap-2">
        <hlm-checkbox inputId="allow-suggestions" [(ngModel)]="suggestionsEnabled"></hlm-checkbox>
        <label for="allow-suggestions" class="cursor-pointer">{{
          t("allowSuggestions")
        }}</label>
      </div>
    }
  </div>
  <div class="flex justify-end gap-2 mt-6">
    <button hlmBtn type="button" variant="ghost" (click)="close()">{{ t('cancel') }}</button>
    <button hlmBtn type="button" [disabled]="saving" (click)="save()">@if (saving) { <hlm-spinner /> } {{ t('save') }}</button>
  </div>
</ng-container>
