<ng-container *transloco="let t; read: 'user.charts'">
  @if (yearChartData?.labels?.length) {
    <div class="year-chart-wrap charts-section-box charts-section-box--blue">
      <canvas
        lcChartJs="bar"
        [data]="yearChartData"
        [options]="yearChartOptions"
      ></canvas>
    </div>
  } @else {
    <div hlmAlert>
      <ng-icon name="lucideInfo" />
      <p hlmAlertDescription>{{ emptyText || t("noAscentYearData") }}</p>
    </div>
  }
</ng-container>
