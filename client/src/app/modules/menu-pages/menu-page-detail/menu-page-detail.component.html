<div class="content">
  <div class="p-6">
    @if (menuPage) {
      <div
        [innerHTML]="menuPage.text | sanitizeHtml"
        class="wysiwyg-content"
      ></div>
    }
    @if (!menuPage) {
      <div hlmSkeleton class="mb-6" style="height: 2rem"></div>
      <div
        hlmSkeleton
        class="mb-2"
        style="width: 50rem; height: 4rem"
      ></div>
      <div
        hlmSkeleton
        class="mb-2"
        style="width: 70rem; height: 2rem"
      ></div>
      <div hlmSkeleton style="width: 40rem; height: 5rem"></div>
    }
  </div>
</div>
