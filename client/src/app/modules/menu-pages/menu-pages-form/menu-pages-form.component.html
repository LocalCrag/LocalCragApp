<ng-container *transloco="let t; read: 'menuPages.menuPageForm'">
  <div class="content p-6">
    <form [formGroup]="menuPageForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="title">{{
          t("menuPageTitleLabel")
        }}</label>
        <input
          type="text"
          pInputText
          id="title"
          formControlName="title"
          placeholder="{{ t('menuPageTitlePlaceholder') }}"
          lcFormControl
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 120 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="text">{{
          t("menuPageTextLabel")
        }}</label>
        <lc-wysiwyg-editor
          id="text"
          formControlName="text"
          lcFormControl
          height="500px"
          toolbar="rich"
          [readonly]="loadingState === loadingStates.LOADING"
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
      </div>
    </form>

    <div class="form-actions">
      @if (!editMode) {
        <p-button
          label="{{ t('createMenuPageButtonLabel') }}"
          (click)="saveMenuPage()"
          icon="pi pi-save"
          class="responsive-button"
          [loading]="loadingState === loadingStates.LOADING"
        ></p-button>
      }
      @if (editMode) {
        <p-button
          label="{{ t('editMenuPageButtonLabel') }}"
          (click)="saveMenuPage()"
          icon="pi pi-save"
          class="responsive-button"
          [loading]="loadingState === loadingStates.LOADING"
        ></p-button>
      }
      <p-button
        label="{{ t('cancelButtonLabel') }}"
        (click)="cancel()"
        class="responsive-button"
        styleClass="p-button-secondary"
        icon="pi pi-ban"
      ></p-button>
      @if (editMode) {
        <p-button
          label="{{ t('deleteMenuPageButtonLabel') }}"
          (click)="confirmDeleteMenuPage($event)"
          icon="pi pi-trash"
          class="responsive-button"
          styleClass="p-button-danger"
          [loading]="loadingState === loadingStates.LOADING"
        ></p-button>
      }
      <p-confirmpopup></p-confirmpopup>
    </div>
  </div>
</ng-container>
