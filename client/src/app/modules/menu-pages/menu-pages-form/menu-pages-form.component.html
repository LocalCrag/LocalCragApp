<ng-container *transloco="let t; read: 'menuPages.menuPageForm'">
  <div class="content p-6">
    <form [formGroup]="menuPageForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="title">{{
          t("menuPageTitleLabel")
        }}</label>
        <input
          type="text"
          hlmInput
          id="title"
          formControlName="title"
          placeholder="{{ t('menuPageTitlePlaceholder') }}"
          lcFormControl
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 120 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="text">{{
          t("menuPageTextLabel")
        }}</label>
        <lc-wysiwyg-editor
          id="text"
          formControlName="text"
          lcFormControl
          height="500px"
          toolbar="rich"
          [readonly]="loadingState === loadingStates.LOADING"
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
      </div>
    </form>

    <div class="form-actions">
      @if (!editMode) {
        <button
          hlmBtn
          type="button"
          class="responsive-button"
          [disabled]="loadingState === loadingStates.LOADING"
          (click)="saveMenuPage()"
        >
          @if (loadingState === loadingStates.LOADING) {
            <hlm-spinner />
          }
          <ng-icon name="lucideSave" /> {{ t("createMenuPageButtonLabel") }}
        </button>
      }
      @if (editMode) {
        <button
          hlmBtn
          type="button"
          class="responsive-button"
          [disabled]="loadingState === loadingStates.LOADING"
          (click)="saveMenuPage()"
        >
          @if (loadingState === loadingStates.LOADING) {
            <hlm-spinner />
          }
          <ng-icon name="lucideSave" /> {{ t("editMenuPageButtonLabel") }}
        </button>
      }
      <button
        hlmBtn
        type="button"
        variant="secondary"
        class="responsive-button"
        (click)="cancel()"
      >
        <ng-icon name="lucideBan" /> {{ t("cancelButtonLabel") }}
      </button>
      @if (editMode) {
        <button
          hlmBtn
          type="button"
          variant="destructive"
          class="responsive-button"
          [disabled]="loadingState === loadingStates.LOADING"
          (click)="confirmDeleteMenuPage($event)"
        >
          @if (loadingState === loadingStates.LOADING) {
            <hlm-spinner />
          }
          <ng-icon name="lucideTrash2" /> {{ t("deleteMenuPageButtonLabel") }}
        </button>
      }
    </div>
  </div>
</ng-container>
