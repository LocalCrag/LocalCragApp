<ng-container *transloco="let t; read: 'faRemoval.dialog'">
  <div class="fa-removal-message-dialog-body">{{ message }}</div>
  <div class="flex w-full justify-end gap-2 mt-6">
    @if (ascentLink) {
      <p-button
        [label]="t('viewAscent')"
        [text]="true"
        (click)="viewAscent()"
      ></p-button>
    }
    <p-button [label]="t('close')" (click)="close()"></p-button>
  </div>
</ng-container>
