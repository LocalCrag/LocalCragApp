<ng-container *transloco="let t; read: 'menu'">
  <div class="content notifications-page">
    <div class="p-6">
      <div class="notifications-page-actions">
        <button
          hlmBtn
          type="button"
          variant="ghost"
          (click)="markAllRead()"
          [disabled]="unreadCount() === 0"
        >
          {{ t("notificationsMarkAllRead") }}
        </button>
      </div>

      @if (loading && notifications.length === 0) {
        <lc-list-skeleton></lc-list-skeleton>
      } @else if (!loading && notifications.length === 0) {
        <div hlmAlert class="w-full">
          <ng-icon name="lucideInfo" />
          <p hlmAlertDescription>{{ t("notificationsEmpty") }}</p>
        </div>
      } @else {
        <div class="notifications-page-list">
          @for (notification of notifications; track notification.id) {
            <div
              class="notifications-page-item"
              [class.is-read]="notification.isDismissed"
            >
              <button
                type="button"
                class="notifications-page-item-main"
                (click)="openNotification(notification)"
              >
                <div class="notifications-page-item-icon">
                  @if (notificationUi.isReaction(notification)) {
                    <span>{{
                      notification.properties.reaction?.emoji || "😊"
                    }}</span>
                  } @else if (notification.type === "comment_reply") {
                    <ng-icon name="lucideMessageCircle" />
                  } @else if (notification.type === "release_notes") {
                    <ng-icon name="lucideMegaphone" />
                  } @else if (notification.type === "admin_message") {
                    <ng-icon name="lucideMail" />
                  } @else if (
                    notification.type === "moderator_task_completed" ||
                    notification.type === "moderator_task_created" ||
                    notification.type ===
                      "moderator_task_created_and_assigned" ||
                    notification.type === "moderator_task_assigned"
                  ) {
                    <ng-icon name="lucideListChecks" />
                  } @else if (
                    notification.type === "suggestion_submitted" ||
                    notification.type === "suggestion_published" ||
                    notification.type === "suggestion_rejected"
                  ) {
                    <ng-icon name="lucideFlag" />
                  } @else {
                    <ng-icon name="lucideSettings" />
                  }
                </div>
                <div class="notifications-page-item-content">
                  <div class="notifications-page-item-text">
                    {{ notificationUi.notificationText(notification) }}
                  </div>
                  <div class="notifications-page-item-time">
                    {{ notification.timeCreated | date }}
                  </div>
                </div>
              </button>
              @if (!notification.isDismissed) {
                <button
                  type="button"
                  class="notifications-page-item-mark"
                  (click)="markNotificationRead(notification)"
                >
                  {{ t("notificationsMarkReadOnly") }}
                </button>
              }
            </div>
          }
        </div>
      }

      @if (hasNextPage) {
        <div class="notifications-page-load-more">
          <button
            hlmBtn
            type="button"
            (click)="loadNextPage()"
            [disabled]="loading"
          >
            {{ t("history.loadMore") }}
          </button>
        </div>
      }
    </div>
  </div>
</ng-container>
