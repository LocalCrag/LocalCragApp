<ng-container *transloco="let t; read: 'activateAccount'">
  <div class="auth-container">
    <div class="card login-card">
      <h3>{{ t("activateAccountTitle") }}</h3>

      {{ t("activateAccountDescription") }}

      <button hlmBtn type="button" (click)="logout()">
        {{ t("activateNowButtonLabel") }}
      </button>

      <a hlmBtn variant="ghost" class="link-button" routerLink="/">
        {{ t("cancelButtonLabel") }}
      </a>
    </div>
  </div>
</ng-container>
