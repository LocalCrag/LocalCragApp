<ng-container *transloco="let t; read: 'changeEmail'">
  <div class="auth-container">
    <div class="card login-card">
      <h3>{{ t("changeEmailTitle") }}</h3>

      @if (loading) {
        <hlm-spinner aria-label="loading"></hlm-spinner>
      }

      @if (!loading && !error) {
        <div hlmAlert>{{ t("emailChangedSuccessfully") }}</div>
      }

      @if (!loading && error) {
        <div hlmAlert variant="destructive">{{ t("emailChangeError") }}</div>
      }

      @if (!loading && !error) {
        <a hlmBtn routerLink="/topo">{{ t("takeMeToTheRock") }}</a>
      }
    </div>
  </div>
</ng-container>
