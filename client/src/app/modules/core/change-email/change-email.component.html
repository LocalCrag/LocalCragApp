<ng-container *transloco="let t; read: 'changeEmail'">
  <div class="auth-container">
    <div class="card login-card">
      <h3>{{ t("changeEmailTitle") }}</h3>

      @if (loading) {
        <p-progress-spinner ariaLabel="loading"></p-progress-spinner>
      }

      @if (!loading && !error) {
        <p-message
          severity="success"
         
        >{{ t('emailChangedSuccessfully') }}
        </p-message>
      }

      @if (!loading && error) {
        <p-message severity="error">{{ t('emailChangeError') }}
        </p-message>
      }

      @if (!loading && !error) {
        <p-button
          label="{{ t('takeMeToTheRock') }}"
          routerLink="/topo"
        ></p-button>
      }
    </div>
  </div>
</ng-container>
