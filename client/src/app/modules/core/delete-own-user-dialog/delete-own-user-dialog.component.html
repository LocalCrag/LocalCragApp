<ng-container *transloco="let t; read: 'accountForm'">
  <h2 class="text-lg font-semibold mb-4">{{ t("deleteAccountDialogTitle") }}</h2>
  <div class="mb-6">
    {{ t("deleteAccountDialogDescription", { email: email }) }}
  </div>
  <form [formGroup]="form" lcForm>
    <div class="card-container block" lcControlGroup>
      <input
        type="text"
        class="w-full"
        hlmInput
        formControlName="email"
        placeholder="{{ t('deleteAccountDialogEmailPlaceholder') }}"
        lcFormControl
      />
    </div>
  </form>

  <div class="form-actions mt-6 justify-end">
    <button hlmBtn type="button" variant="outline" (click)="cancel()">{{ t('deleteAccountDialogCancel') }}</button>
    <button hlmBtn type="button" variant="destructive" (click)="confirm()" [disabled]="!form.valid || !emailMatches">{{ t('deleteAccountDialogConfirm') }}</button>
  </div>
</ng-container>
