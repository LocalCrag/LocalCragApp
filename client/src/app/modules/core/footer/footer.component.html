<ng-container *transloco="let t; read: 'footer'">
  @if (menuItems.length > 0) {
    <div class="footer-menu">
      @for (menuItem of menuItems; track menuItem) {
        @if (menuItem.routerLink) {
          <a hlmBtn variant="ghost" [routerLink]="menuItem.routerLink">
            {{ menuItem.title }}
          </a>
        }
        @if (menuItem.link) {
          <button hlmBtn variant="ghost" type="button" (click)="openLink(menuItem.link)">
            {{ menuItem.title }}
          </button>
        }
      }
    </div>
  }
  <div class="footer-notes">
    <div class="footer-note-item">
      {{ t("copyright") }} © {{ currentYear }} {{ copyrightOwner$ | async }}
    </div>
    <div class="footer-note-item">
      Powered with 🦾 by
      <a href="https://github.com/LocalCrag/LocalCragApp" target="_blank"
        >LocalCrag</a
      >
      <span class="version"> v{{ version }} </span>
    </div>
  </div>
</ng-container>
