@if (accessDenied) {
  <ng-container *transloco="let t; read: 'appLevelAlerts'">
    <div
      class="storage-access-alert"
      role="alert"
      data-cy="storage-access-alert"
    >
      <i class="pi pi-exclamation-circle"></i>
      {{ t("localStorageDenied") }}
    </div>
  </ng-container>
}
