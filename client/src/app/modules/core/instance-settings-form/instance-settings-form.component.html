<ng-container *transloco="let t; read: 'instanceSettings.instanceSettingsForm'">
  <div class="content p-6">
    <form [formGroup]="instanceSettingsForm" lcForm>
      <p-tabs [(value)]="activeTab">
        <p-tablist>
          <p-tab value="general">{{ t("commonSettings") }}</p-tab>
          <p-tab value="appearance">{{ t("imagesSettings") }}</p-tab>
          <p-tab value="analytics">{{ t("matomoSettings") }}</p-tab>
          <p-tab value="maps">{{ t("mapSettings") }}</p-tab>
        </p-tablist>
      </p-tabs>

      @if (activeTab === "general") {
        <lc-instance-settings-general-tab
          [group]="generalGroup()"
          [loading]="loadingState === loadingStates.LOADING"
          [save]="saveGeneralTab"
        />
      }

      @if (activeTab === "appearance") {
        <lc-instance-settings-appearance-tab
          [group]="appearanceGroup()"
          [loading]="loadingState === loadingStates.LOADING"
          [save]="saveAppearanceTab"
        />
      }

      @if (activeTab === "analytics") {
        <lc-instance-settings-analytics-tab
          [group]="analyticsGroup()"
          [loading]="loadingState === loadingStates.LOADING"
          [save]="saveAnalyticsTab"
        />
      }

      @if (activeTab === "maps") {
        <lc-instance-settings-maps-tab
          [group]="mapsGroup()"
          [loading]="loadingState === loadingStates.LOADING"
          [save]="saveMapsTab"
        />
      }
    </form>
  </div>
</ng-container>
