<ng-container *transloco="let t; read: 'instanceSettings.instanceSettingsForm'">
  <div [formGroup]="group" class="flex flex-col gap-4 pt-4">
    <lc-storage-usage />

    <div class="flex flex-col gap-2" lcControlGroup>
      <div class="form-label flex items-center">
        <label for="video-uploads-enabled">{{
          t("videoUploadsEnabledLabel")
        }}</label>
        <span
          class="pi pi-question-circle ml-2"
          [pTooltip]="t('videoUploadsEnabledTooltip')"
          tooltipPosition="right"
        ></span>
      </div>
      <p-select
        id="video-uploads-enabled"
        [options]="[
          { value: false, label: t('videoUploadsEnabledFalse') },
          { value: true, label: t('videoUploadsEnabledTrue') },
        ]"
        optionLabel="label"
        optionValue="value"
        formControlName="videoUploadsEnabled"
        lcFormControl
      />
    </div>

    <div class="form-actions">
      <p-button
        label="{{ t('editInstanceSettingsButtonLabel') }}"
        (click)="save()"
        icon="pi pi-save"
        class="responsive-button"
        [loading]="loading"
      ></p-button>
    </div>
  </div>
</ng-container>
