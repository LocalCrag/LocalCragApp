<ng-container *transloco="let t; read: 'instanceSettings.instanceSettingsForm'">
  <div [formGroup]="group" class="flex flex-col gap-4 pt-4">
    <div class="lc-theme-variant-pair">
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="logo-upload">{{
          t("logoImageLabel")
        }}</label>
        <lc-single-image-upload
          lcFormControl
          id="logo-upload"
          formControlName="logoImage"
        ></lc-single-image-upload>
      </div>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="dark-logo-upload">{{
          t("darkLogoImageLabel")
        }}</label>
        <lc-single-image-upload
          lcFormControl
          id="dark-logo-upload"
          formControlName="darkLogoImage"
        ></lc-single-image-upload>
      </div>
    </div>

    <div class="flex flex-col gap-2" lcControlGroup>
      <label class="form-label" for="favicon-image-upload">{{
        t("faviconImageLabel")
      }}</label>
      <lc-single-image-upload
        id="favicon-image-upload"
        lcFormControl
        formControlName="faviconImage"
      ></lc-single-image-upload>
    </div>

    <div class="flex flex-col gap-2" lcControlGroup>
      <div class="form-label flex items-center">
        <label for="bg-image">{{ t("bgImageLabel") }}</label>
        <ng-icon
          name="lucideCircleHelp"
          class="inline ml-2"
          [hlmTooltip]="t('bgImageTooltip')"
          position="right"
        />
      </div>
      <lc-single-image-upload
        id="bg-image"
        lcFormControl
        formControlName="bgImage"
        [focusAdjustable]="true"
      ></lc-single-image-upload>
    </div>

    <div class="mt-8 mb-2 flex items-center gap-3">
      <div hlmSeparator class="flex-1"></div>
      <b>{{ t("arrowsSettings") }}</b>
      <div hlmSeparator class="flex-1"></div>
    </div>

    <div class="flex flex-col gap-2" lcControlGroup>
      <div class="form-label flex items-center">
        <label for="color-lines-by-scale">{{
          t("colorLinesByScaleLabel")
        }}</label>
        <ng-icon
          name="lucideCircleHelp"
          class="inline ml-2"
          [hlmTooltip]="t('colorLinesByScaleTooltip')"
          position="right"
        />
      </div>
      <hlm-switch
        inputId="color-lines-by-scale"
        formControlName="colorLinesByScale"
      />
    </div>

    <div class="flex flex-col gap-2" lcControlGroup>
      <label class="form-label" for="arrow-color">{{
        t("arrowColorLabel")
      }}</label>
      <ngx-colors ngx-colors-trigger formControlName="arrowColor"></ngx-colors>
    </div>
    <div class="flex flex-col gap-2" lcControlGroup>
      <label class="form-label" for="arrowTextColor">{{
        t("arrowTextColorLabel")
      }}</label>
      <ngx-colors
        ngx-colors-trigger
        formControlName="arrowTextColor"
      ></ngx-colors>
    </div>
    <div class="flex flex-col gap-2" lcControlGroup>
      <label class="form-label" for="arrow-highlight-color">{{
        t("arrowHighlightColorLabel")
      }}</label>
      <ngx-colors
        ngx-colors-trigger
        formControlName="arrowHighlightColor"
      ></ngx-colors>
    </div>
    <div class="flex flex-col gap-2" lcControlGroup>
      <label class="form-label" for="arrow-highlight-text-color">{{
        t("arrowHighlightTextColorLabel")
      }}</label>
      <ngx-colors
        ngx-colors-trigger
        formControlName="arrowHighlightTextColor"
      ></ngx-colors>
    </div>

    <div class="mt-8 mb-2 flex items-center gap-3">
      <div hlmSeparator class="flex-1"></div>
      <b>{{ t("chartSettings") }}</b>
      <div hlmSeparator class="flex-1"></div>
    </div>

    <div class="lc-theme-variant-pair">
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="bar-chart-color">{{
          t("barChartColorLabel")
        }}</label>
        <ngx-colors
          ngx-colors-trigger
          formControlName="barChartColor"
        ></ngx-colors>
      </div>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="dark-bar-chart-color">{{
          t("darkBarChartColorLabel")
        }}</label>
        <ngx-colors
          ngx-colors-trigger
          formControlName="darkBarChartColor"
        ></ngx-colors>
      </div>
    </div>

    <div class="lc-theme-variant-pair">
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="bar-chart-accent-color">{{
          t("barChartAccentColorLabel")
        }}</label>
        <ngx-colors
          ngx-colors-trigger
          formControlName="barChartAccentColor"
        ></ngx-colors>
      </div>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="dark-bar-chart-accent-color">{{
          t("darkBarChartAccentColorLabel")
        }}</label>
        <ngx-colors
          ngx-colors-trigger
          formControlName="darkBarChartAccentColor"
        ></ngx-colors>
      </div>
    </div>

    <div class="form-actions">
      <button
        hlmBtn
        type="button"
        class="responsive-button"
        (click)="save()"
        [disabled]="loading"
      >
        <ng-icon name="lucideSave" /> {{ t("editInstanceSettingsButtonLabel") }}
      </button>
    </div>
  </div>
</ng-container>
