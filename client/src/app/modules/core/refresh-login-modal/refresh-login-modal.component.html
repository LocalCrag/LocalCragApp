<ng-container *transloco="let t; read: 'refreshLoginModal'">
  <hlm-dialog
    [state]="isOpen ? 'open' : 'closed'"
    [disableClose]="true"
    (stateChanged)="isOpen = $event === 'open'"
  >
    <ng-template brnDialogContent>
      <hlm-dialog-content [showCloseButton]="false">
        <h2 hlmDialogTitle>{{ t("title") }}</h2>
        @if (challenge$ | async) {
          <lc-two-factor-prompt></lc-two-factor-prompt>
        } @else {
          <form [formGroup]="refreshLoginForm" lcForm>
            <div class="card-container block" lcControlGroup>
              <lc-password-input
                formControlName="password"
                autocomplete="current-password"
                lcFormControl
                placeholder="{{ t('passwordPlaceholder') }}"
              />
              <small class="lc-error" *lcIfError="'required'">{{
                "validation.required" | transloco
              }}</small>
            </div>
          </form>
          <div class="form-actions mt-6 justify-end">
            <button
              hlmBtn
              type="button"
              (click)="refreshLogin()"
              [disabled]="(isLoading$ | async) === loadingStates.LOADING"
            >
              {{ t("refreshLoginButtonLabel") }}
            </button>
          </div>
        }
        <div class="form-actions mt-6 justify-end">
          <button
            hlmBtn
            type="button"
            variant="outline"
            (click)="logout()"
            [disabled]="(logoutIsLoading$ | async) === loadingStates.LOADING"
          >
            {{ t("logoutButtonLabel") }}
          </button>
        </div>
      </hlm-dialog-content>
    </ng-template>
  </hlm-dialog>
</ng-container>
