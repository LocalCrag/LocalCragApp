<ng-container *transloco="let t; read: 'ascents.ascentList'">
  <a
    class="video-mark"
    [routerLink]="ascent.routerLinkLine + '/videos'"
    [queryParams]="{ ascent: ascent.id }"
    [attr.title]="t('hasVideo')"
  >
    <i class="pi pi-video" aria-hidden="true"></i>
    <span class="sr-only">{{ t("hasVideo") }}</span>
  </a>
</ng-container>
