<ng-container *transloco="let t; read: 'tickButton'">
  @if (visible) {
    <button
      hlmBtn
      type="button"
      variant="ghost"
      [size]="showLabel ? 'default' : 'icon'"
      class="tick-button rounded-full"
      data-cy="tick-button"
      (click)="addAscent($event)"
      [ngClass]="{ disabled: ticked }"
      [disabled]="ticked"
      [attr.aria-label]="
        showLabel ? null : ticked ? t('lineClimbed') : t('addAscent')
      "
    >
      <ng-icon name="lucideCheck" [class.ticked-icon]="ticked" />
      @if (showLabel) {
        {{ ticked ? t("lineClimbed") : t("addAscent") }}
      }
    </button>
  }
</ng-container>
