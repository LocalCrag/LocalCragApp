<ng-container *transloco="let t; read: 'projectClimbedForm'">
  <lc-project-climbed-form-title />
  <form [formGroup]="projectClimbedForm" lcForm>
    <div hlmAlert>
      <p hlmAlertDescription>{{ t("projectClimbedInfoMessage") }}</p>
    </div>

    <div class="flex flex-col gap-2" lcControlGroup>
      <textarea
        rows="5"
        cols="30"
        hlmTextarea
        lcFormControl
        formControlName="message"
        class="w-full mt-6"
        data-cy="message"
        [placeholder]="t('message')"
      ></textarea>
      <small class="lc-error" *lcIfError="'required'">{{
        "validation.required" | transloco
      }}</small>
    </div>
  </form>

  <div class="form-actions">
    <button
      hlmBtn
      type="button"
      class="w-full"
      (click)="sendMessage()"
      [disabled]="loadingState === loadingStates.LOADING"
      data-cy="submit"
    >
      @if (loadingState === loadingStates.LOADING) {
        <hlm-spinner />
      }
      {{ t("sendProjectClimbedMessageButtonLabel") }}
    </button>
  </div>
</ng-container>
