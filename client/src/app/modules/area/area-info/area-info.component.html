<ng-container *transloco="let t; read: 'area.area'">
  <div class="p-6">
    @if (area) {
      @if (area.upcomingClosureWarnings?.length) {
        <lc-upcoming-closure-alert
          [warnings]="area.upcomingClosureWarnings"
        ></lc-upcoming-closure-alert>
      }
      <lc-current-conditions
        *isOutdoorMode="true"
        [slug]="area.slug"
        [level]="'area'"
      ></lc-current-conditions>
      @if (!gradeDiagramsSuppressed) {
        <h4>{{ t("gradeDistribution") }}:</h4>
      }
      <lc-grade-distribution-bar-chart
        [fetchingObservable]="fetchAreaGrades"
        (diagramsSuppressedChange)="gradeDiagramsSuppressed = $event"
      ></lc-grade-distribution-bar-chart>
      @if (area.description) {
        <h4>{{ t("description") }}:</h4>
        <section
          [innerHTML]="area.description | sanitizeHtml"
          class="wysiwyg-content"
        ></section>
      }
      @if (areaCoordinates) {
        <lc-coordinates-button
          [coordinates]="areaCoordinates"
        ></lc-coordinates-button>
      }
      <lc-map [target]="area"></lc-map>
    }

    @if (!area) {
      <div hlmSkeleton class="h-4 w-full mb-2"></div>
      <div hlmSkeleton class="h-4 w-[90%] mb-2"></div>
      <div hlmSkeleton class="h-4 w-[87%] mb-2"></div>
      <div hlmSkeleton class="h-4 w-[70%] mb-2"></div>
      <div hlmSkeleton class="h-4 w-[65%] mb-2"></div>
      <div hlmSkeleton class="h-4 w-[45%] mb-6"></div>
      <div hlmSkeleton class="h-16 w-full mb-6"></div>
      <div hlmSkeleton class="h-16 w-[40%]"></div>
    }
  </div>
</ng-container>
