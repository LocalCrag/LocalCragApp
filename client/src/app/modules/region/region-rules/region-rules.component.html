<div class="p-6">
  @if (region) {
    <lc-rules-view-meta
      entityType="Region"
      [entityId]="region.id"
      [rulesUpdatedAt]="region.rulesUpdatedAt"
    ></lc-rules-view-meta>
    <section
      [innerHTML]="region.rules | sanitizeHtml"
      class="quill-content"
    ></section>
  }

  @if (!region) {
    <p-skeleton width="100%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="90%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="87%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="70%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="65%" styleClass="mb-2"></p-skeleton>
    <p-skeleton width="45%" styleClass="mb-6"></p-skeleton>
    <p-skeleton height="4rem" styleClass="mb-6"></p-skeleton>
    <p-skeleton width="40%" height="4rem"></p-skeleton>
  }
</div>
