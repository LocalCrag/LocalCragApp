<ng-container *transloco="let t; read: 'region.regionForm'">
  <div class="content p-6">
    <form [formGroup]="regionForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="name">{{ t("regionNameLabel") }}</label>
        <input
          id="name"
          type="text"
          hlmInput
          formControlName="name"
          placeholder="{{ t('regionNamePlaceholder') }}"
          lcFormControl
          data-cy="region-form-name"
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 120 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="description">{{
          t("regionDescriptionLabel")
        }}</label>
        <lc-wysiwyg-editor
          id="description"
          formControlName="description"
          lcFormControl
          [placeholder]="t('regionDescriptionPlaceholder')"
          height="200px"
          toolbar="rich"
          [readonly]="loadingState === loadingStates.INITIAL_LOADING"
        />
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="image">{{
          t("regionImageLabel")
        }}</label>
        <lc-single-image-upload
          id="image"
          lcFormControl
          formControlName="image"
          [focusAdjustable]="true"
        ></lc-single-image-upload>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="rules">{{
          t("regionRulesLabel")
        }}</label>
        <lc-wysiwyg-editor
          id="rules"
          formControlName="rules"
          lcFormControl
          [placeholder]="t('regionRulesPlaceholder')"
          height="200px"
          toolbar="rich"
          [readonly]="loadingState === loadingStates.INITIAL_LOADING"
        />
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <div class="form-label flex items-center">
          <label for="rulesTitle">{{ t("regionRulesTitleLabel") }}</label>
          <button
            type="button"
            class="inline-flex text-muted-foreground ml-2"
            [hlmTooltip]="t('regionRulesTitleTooltip')"
            position="right"
          >
            <ng-icon name="lucideCircleQuestionMark" />
          </button>
        </div>
        <input
          id="rulesTitle"
          type="text"
          hlmInput
          formControlName="rulesTitle"
          placeholder="{{ t('regionRulesTitlePlaceholder') }}"
          lcFormControl
          data-cy="region-form-rulesTitle"
        />
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 255 }
        }}</small>
      </div>
    </form>

    <div class="form-actions">
      @if (editMode) {
        <button
          hlmBtn
          type="button"
          class="responsive-button"
          (click)="saveRegion()"
          [disabled]="loadingState === loadingStates.LOADING"
        >
          @if (loadingState === loadingStates.LOADING) {
            <ng-icon name="lucideLoaderCircle" class="animate-spin" />
          } @else {
            <ng-icon name="lucideSave" />
          }
          {{ t("editRegionButtonLabel") }}
        </button>
      }
      <button
        hlmBtn
        type="button"
        variant="secondary"
        class="responsive-button"
        (click)="cancel()"
      >
        <ng-icon name="lucideBan" /> {{ t("cancelButtonLabel") }}
      </button>
    </div>
  </div>
</ng-container>
