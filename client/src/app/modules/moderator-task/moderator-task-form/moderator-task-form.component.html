<ng-container *transloco="let t; read: 'moderatorTasks'">
  <div class="content p-6">
    <form [formGroup]="taskForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="title">{{ t("titleLabel") }}</label>
        <input
          type="text"
          hlmInput
          id="title"
          formControlName="title"
          placeholder="{{ t('titlePlaceholder') }}"
          lcFormControl
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 120 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="assigned-to">{{
          t("assignedToLabel")
        }}</label>
        <hlm-select
          formControlName="assignedTo"
          [itemToString]="assigneeItemLabel"
          [disabled]="usersLoading"
          lcFormControl
          ><hlm-select-trigger class="w-full"
            ><hlm-select-value
              placeholder="{{
                t('assignedToPlaceholder')
              }}" /></hlm-select-trigger
          ><hlm-select-content *hlmSelectPortal>
            @for (user of assigneeUsers; track $index) {
              <hlm-select-item [value]="user">{{
                assigneeLabel(user)
              }}</hlm-select-item>
            }
          </hlm-select-content></hlm-select
        >
        <button
          hlmBtn
          type="button"
          variant="ghost"
          size="sm"
          class="self-start"
          [disabled]="!taskForm.get('assignedTo').value"
          (click)="taskForm.get('assignedTo').setValue(null)"
        >
          {{ t("clearAssignee") }}
        </button>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="description">{{
          t("descriptionLabel")
        }}</label>
        <lc-wysiwyg-editor
          id="description"
          formControlName="description"
          lcFormControl
          height="320px"
          toolbar="rich-no-video"
          [readonly]="loadingState === loadingStates.LOADING"
        />
      </div>
    </form>

    <div class="form-actions">
      <button
        lcLoadingButton
        icon="lucideSave"
        [loading]="loadingState === loadingStates.LOADING"
        (click)="saveTask()"
        [disabled]="loadingState === loadingStates.LOADING"
        type="button"
      >
        {{ editMode ? t("saveTaskButton") : t("createTaskButton") }}
      </button>
      <button hlmBtn type="button" variant="secondary" (click)="cancel()">
        <ng-icon name="lucideBan" /> {{ t("cancelButton") }}
      </button>
      @if (editMode) {
        <button
          lcLoadingButton
          icon="lucideTrash2"
          [loading]="loadingState === loadingStates.LOADING"
          (click)="confirmDelete($event)"
          [disabled]="loadingState === loadingStates.LOADING"
          type="button"
          variant="destructive"
        >
          {{ t("deleteTaskButton") }}
        </button>
      }
    </div>
  </div>
</ng-container>
