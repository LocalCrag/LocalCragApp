<ng-container *transloco="let t; read: 'advancedColorPicker'">
  @if (isInitalized) {
    <form
      [formGroup]="colorForm"
      lcForm
      class="flex flex-row"
      [class]="{ 'gap-2': colorForm?.get('customColor').value }"
    >
      <hlm-select
        formControlName="customColor"
        class="w-full"
        lcFormControl
        [itemToString]="colorModeLabel"
      >
        <hlm-select-trigger class="w-full">
          <hlm-select-value />
        </hlm-select-trigger>
        <hlm-select-content *hlmSelectPortal>
          <hlm-select-item [value]="false">{{
            t("globalColor")
          }}</hlm-select-item>
          <hlm-select-item [value]="true">{{
            t("customColor")
          }}</hlm-select-item>
        </hlm-select-content>
      </hlm-select>
      @if (colorForm?.get("customColor").value) {
        <ngx-colors
          ngx-colors-trigger
          class="flex justify-center items-center"
          [acceptLabel]="t('accept')"
          [cancelLabel]="t('cancel')"
          formControlName="color"
          [palette]="palette"
        ></ngx-colors>
      }
    </form>
  }
</ng-container>
