<ng-container *transloco="let t; read: 'singleImageUploader'">
  <div class="image-list">
    @for (file of files; track file; let i = $index) {
      <div class="image-item">
        <div class="image-wrapper">
          <button
            type="button"
            class="image-preview"
            [disabled]="isDisabled"
            (click)="previewUrl = file.path"
          >
            <img [src]="file.path" [alt]="file.originalFilename" width="250" />
            @if (!isDisabled) {
              <span class="image-preview-mask">
                <ng-icon name="lucideEye" />
              </span>
            }
          </button>
          @if (!isDisabled) {
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="icon-sm"
              class="image-remove rounded-full"
              (click)="removeMedia(i)"
            >
              <ng-icon name="lucideX" />
            </button>
          }
        </div>
        @if (!isDisabled && file.width && file.height && canEdit(file)) {
          <button
            hlmBtn
            type="button"
            variant="outline"
            size="sm"
            class="image-edit-button"
            [disabled]="transforming"
            [hlmTooltip]="t('editImageTooltip')"
            position="right"
            (click)="openImageEdit(file)"
          >
            <ng-icon name="lucidePencil" />
            {{ t("editImageButtonLabel") }}
          </button>
        }
      </div>
    }
  </div>

  @if (!isDisabled) {
    <button
      hlmBtn
      type="button"
      class="lc-file-trigger"
      [hidden]="showProgressBar"
      (click)="fileInput.click()"
    >
      <ng-icon name="lucideUpload" />
      {{ t("browseFilesButtonLabel") }}
    </button>
    <input
      #fileInput
      type="file"
      class="hidden"
      accept="image/jpeg,image/png,image/gif,image/bmp"
      multiple
      (change)="onFilesSelected($event)"
    />
  }

  @if (showProgressBar) {
    <div
      hlmProgress
      [value]="progressMode === 'indeterminate' ? null : progress"
    >
      <div hlmProgressIndicator></div>
    </div>
  }

  <lc-image-edit-dialog
    [visible]="!!editingFile"
    [saving]="transforming"
    [imageUrl]="editingFile?.path ?? ''"
    [imageWidth]="editingFile?.width ?? 0"
    [imageHeight]="editingFile?.height ?? 0"
    (visibleChange)="onImageEditVisible($event)"
    (applyEdit)="applyImageEdit($event)"
  />

  @if (previewUrl) {
    <hlm-dialog state="open" (closed)="previewUrl = null">
      <hlm-dialog-content *hlmDialogPortal class="sm:max-w-3xl">
        <img [src]="previewUrl" alt="" class="w-full" />
      </hlm-dialog-content>
    </hlm-dialog>
  }
</ng-container>
