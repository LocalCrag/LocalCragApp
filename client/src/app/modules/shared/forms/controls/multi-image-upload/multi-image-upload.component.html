<ng-container *transloco="let t; read: 'singleImageUploader'">
  <div class="image-list">
    @for (file of files; track file; let i = $index) {
      <div class="image-item">
        <div class="image-wrapper">
          <p-image
            [src]="file.path"
            [preview]="!isDisabled"
            [alt]="file.originalFilename"
            width="250"
          >
            <ng-template #indicator>
              <i class="pi pi-eye"></i>
            </ng-template>
          </p-image>
          @if (!isDisabled) {
            <p-button
              icon="pi pi-times"
              (click)="removeMedia(i)"
              styleClass="p-button-rounded p-button-secondary p-button-sm p-button-text"
            ></p-button>
          }
        </div>
        @if (!isDisabled && file.width && file.height && canEdit(file)) {
          <p-button
            class="image-edit-button"
            icon="pi pi-pencil"
            [label]="t('editImageButtonLabel')"
            severity="secondary"
            [outlined]="true"
            size="small"
            [disabled]="transforming"
            [pTooltip]="t('editImageTooltip')"
            tooltipPosition="right"
            (click)="openImageEdit(file)"
          />
        }
      </div>
    }
  </div>

  @if (!isDisabled) {
    <p-fileupload
      mode="basic"
      [hidden]="showProgressBar"
      [name]="'upload'"
      [url]="uploadUrl"
      accept="image/jpeg,image/png,image/gif,image/bmp"
      [multiple]="true"
      [maxFileSize]="maxImageSize"
      (onError)="showProgressBar = false"
      (onBeforeUpload)="startProgress()"
      (onProgress)="setProgress($event)"
      (onUpload)="setMedia($event)"
      [auto]="true"
      chooseLabel="{{ t('browseFilesButtonLabel') }}"
    >
    </p-fileupload>
  }

  @if (showProgressBar) {
    <p-progress-bar [mode]="progressMode" [value]="progress"></p-progress-bar>
  }

  <lc-image-edit-dialog
    [visible]="!!editingFile"
    [saving]="transforming"
    [imageUrl]="editingFile?.path ?? ''"
    [imageWidth]="editingFile?.width ?? 0"
    [imageHeight]="editingFile?.height ?? 0"
    (visibleChange)="onImageEditVisible($event)"
    (applyEdit)="applyImageEdit($event)"
  />
</ng-container>
