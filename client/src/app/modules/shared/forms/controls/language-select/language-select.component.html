<hlm-select
  align="center"
  [value]="value"
  [disabled]="disabled"
  (valueChange)="onSelect($event)"
>
  <hlm-select-trigger class="w-full">
    @if (value) {
      <div class="language-option">
        <img [src]="getFlagSrc(value)" alt="" class="flag" />
        @if (!noLabel) {
          <span>{{ value | transloco }}</span>
        }
      </div>
    } @else if (placeholder) {
      <span class="text-muted-foreground">{{ placeholder }}</span>
    }
  </hlm-select-trigger>
  <hlm-select-content *hlmSelectPortal>
    @for (code of languages; track code) {
      <hlm-select-item
        [value]="code"
        [attr.data-flags-only]="noLabel ? '' : null"
      >
        <div class="language-option">
          <img [src]="getFlagSrc(code)" alt="" class="flag" />
          @if (noLabel) {
            <span class="sr-only">{{ code | transloco }}</span>
          } @else {
            <span>{{ code | transloco }}</span>
          }
        </div>
      </hlm-select-item>
    }
  </hlm-select-content>
</hlm-select>
