<hlm-combobox-multiple
  #combo="brnComboboxMultiple"
  class="w-full"
  [value]="value"
  [disabled]="disabled"
  [itemToString]="searchableLabel"
  [isItemEqualToValue]="sameSearchable"
  [filter]="showSuggestion"
  (valueChange)="onValueChange($event)"
  (searchChange)="loadSuggestions($event)"
>
  <div hlmComboboxChips>
    @for (item of value; track item.id) {
      <hlm-combobox-chip [value]="item">{{ item.name }}</hlm-combobox-chip>
    }
    <input
      hlmComboboxChipInput
      [attr.placeholder]="placeholder"
      (click)="$event.stopPropagation()"
    />
  </div>
  <div hlmComboboxContent *hlmComboboxPortal>
    <div hlmComboboxList class="searchable-autocomplete">
      @for (searchable of suggestions; track searchable.id) {
        <hlm-combobox-item [value]="searchable">
          <lc-searchable
            [searchable]="searchable"
            [disableNavigation]="true"
          ></lc-searchable>
        </hlm-combobox-item>
      }
    </div>
  </div>
</hlm-combobox-multiple>
