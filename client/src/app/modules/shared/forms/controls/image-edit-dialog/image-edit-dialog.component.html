<ng-container *transloco="let t; read: 'singleImageUploader'">
  <hlm-dialog
    [state]="visible ? 'open' : 'closed'"
    [disableClose]="saving"
    (closed)="visibleChange.emit(false)"
  >
    <hlm-dialog-content
      *hlmDialogPortal
      class="lc-image-edit-dialog w-[min(44rem,96vw)] sm:max-w-3xl"
      [showCloseButton]="!saving"
    >
      <div hlmDialogHeader>
        <h2 hlmDialogTitle>{{ t("editImageTitle") }}</h2>
      </div>
      <div class="edit-layout">
        <div
          #stage
          class="edit-stage"
          [style.width.px]="viewWidth"
          [style.height.px]="viewHeight"
          (pointermove)="onStagePointerMove($event)"
          (pointerup)="onStagePointerUp($event)"
          (pointercancel)="onStagePointerUp($event)"
        >
          <img
            class="edit-stage__image"
            [src]="imageUrl"
            alt=""
            draggable="false"
            [style.width.px]="imageLayoutWidth"
            [style.height.px]="imageLayoutHeight"
            [style.transform]="
              'translate(-50%, -50%) rotate(' + rotation + 'deg)'
            "
          />
          <div
            class="edit-stage__shade edit-stage__shade--top"
            [style.height.%]="crop.y * 100"
          ></div>
          <div
            class="edit-stage__shade edit-stage__shade--bottom"
            [style.top.%]="(crop.y + crop.height) * 100"
          ></div>
          <div
            class="edit-stage__shade edit-stage__shade--left"
            [style.top.%]="crop.y * 100"
            [style.height.%]="crop.height * 100"
            [style.width.%]="crop.x * 100"
          ></div>
          <div
            class="edit-stage__shade edit-stage__shade--right"
            [style.top.%]="crop.y * 100"
            [style.height.%]="crop.height * 100"
            [style.left.%]="(crop.x + crop.width) * 100"
          ></div>
          <div
            class="edit-stage__crop"
            [style.left.%]="crop.x * 100"
            [style.top.%]="crop.y * 100"
            [style.width.%]="crop.width * 100"
            [style.height.%]="crop.height * 100"
            (pointerdown)="startMove($event)"
          >
            @for (handle of handles; track handle) {
              <span
                class="edit-stage__handle"
                [class]="'edit-stage__handle--' + handle"
                (pointerdown)="startResize($event, handle)"
              ></span>
            }
          </div>
        </div>
        <p class="edit-hint">{{ t("editImageHint") }}</p>
      </div>

      <div hlmDialogFooter class="edit-footer">
        <div class="edit-footer__tools">
          <button
            hlmBtn
            type="button"
            variant="outline"
            size="icon"
            [disabled]="saving"
            [hlmTooltip]="t('rotateLeftButtonLabel')"
            [attr.aria-label]="t('rotateLeftButtonLabel')"
            position="top"
            (click)="rotateLeft()"
          >
            <ng-icon name="lucideRotateCcw" />
          </button>
          <button
            hlmBtn
            type="button"
            variant="outline"
            size="icon"
            [disabled]="saving"
            [hlmTooltip]="t('rotateRightButtonLabel')"
            [attr.aria-label]="t('rotateRightButtonLabel')"
            position="top"
            (click)="rotateRight()"
          >
            <ng-icon name="lucideRotateCw" />
          </button>
          <button
            hlmBtn
            type="button"
            variant="outline"
            [disabled]="saving"
            (click)="reset()"
          >
            {{ t("resetEditButtonLabel") }}
          </button>
        </div>
        <div class="edit-footer__confirm">
          <button
            hlmBtn
            type="button"
            variant="secondary"
            [disabled]="saving"
            (click)="cancel()"
          >
            {{ t("cancelEditButtonLabel") }}
          </button>
          <button hlmBtn type="button" [disabled]="saving" (click)="apply()">
            @if (saving) {
              <hlm-spinner />
            }
            {{ t("applyEditButtonLabel") }}
          </button>
        </div>
      </div>
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
