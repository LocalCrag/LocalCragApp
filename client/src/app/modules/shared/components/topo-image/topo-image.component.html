<div #konvaContainer></div>

@if (loading) {
  <div
    hlmSkeleton
    [style.width.px]="skeletonWidth"
    [style.height.px]="skeletonHeight"
  ></div>
}

@if (expandable) {
  <button
    type="button"
    class="topo-image-open"
    data-cy="topo-image-full-size"
    [attr.aria-label]="expandLabel"
    (click)="expand.emit()"
  >
    <span class="topo-image-open__icon" aria-hidden="true">
      <ng-icon name="lucideEye" />
    </span>
  </button>
}
