@if (previewEnabled) {
  <button
    type="button"
    [class]="previewStyleClass"
    [attr.aria-label]="ariaLabel"
    (click)="previewOpen = true"
  >
    <img
      [src]="previewImageUrl"
      [alt]="ariaLabel"
      class="lc-user-avatar-preview-thumb"
    />
    <span class="lc-user-avatar-preview-mask">
      <ng-icon name="lucideEye" />
    </span>
  </button>
  <hlm-dialog
    [state]="previewOpen ? 'open' : 'closed'"
    (closed)="previewOpen = false"
  >
    <hlm-dialog-content *hlmDialogPortal class="sm:max-w-3xl">
      <img [src]="previewImageUrl" [alt]="ariaLabel" class="w-full" />
    </hlm-dialog-content>
  </hlm-dialog>
} @else if (imageUrl) {
  <span
    hlmAvatar
    [size]="avatarSize"
    [class]="avatarClass + ' lc-user-avatar--initials'"
    [attr.aria-label]="ariaLabel"
  >
    <img hlmAvatarImage [src]="imageUrl" [alt]="ariaLabel" />
    <span
      hlmAvatarFallback
      class="text-primary-foreground"
      [style]="gradientStyle"
      >{{ initials }}</span
    >
  </span>
} @else {
  <span
    hlmAvatar
    [size]="avatarSize"
    [class]="fallbackClasses + ' ' + avatarClass"
    [attr.aria-label]="ariaLabel"
  >
    <span
      hlmAvatarFallback
      class="text-primary-foreground"
      [style]="gradientStyle"
      >{{ initials }}</span
    >
  </span>
}
