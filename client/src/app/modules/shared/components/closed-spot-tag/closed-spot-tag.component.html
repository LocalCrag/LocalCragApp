<ng-container *transloco="let t; read: 'closedSpotTag'">
  <hlm-popover align="end" (stateChanged)="onPopoverState($event)">
    <button
      type="button"
      hlmPopoverTrigger
      class="closed-spot-tag-trigger"
      [attr.aria-label]="t('showReasons')"
      [hlmTooltip]="t(isPermanentClosure ? 'closed' : 'temporarilyClosed')"
      [tooltipDisabled]="disableTooltip()"
      (click)="onTagClick($event)"
    >
      <span hlmBadge variant="destructive" class="closed-spot-tag h-auto">
        <span class="closed-spot-tag-inner">
          <ng-icon name="lucideBan" aria-hidden="true" />
          <span class="spot-status-tag__label">{{
            t(isPermanentClosure ? "closed" : "temporarilyClosed")
          }}</span>
          <ng-icon
            class="closed-spot-tag__help"
            name="lucideCircleHelp"
            aria-hidden="true"
          />
        </span>
      </span>
    </button>

    <div
      hlmPopoverContent
      *hlmPopoverPortal
      class="closed-spot-tag-popover w-auto"
    >
      <div class="closed-spot-tag-popover-content">
        @if (loading) {
          <hlm-spinner class="closed-spot-tag-spinner size-8" />
        } @else if (loadError) {
          <span class="closed-spot-tag-error">{{ t("loadError") }}</span>
        } @else if (displayReasons !== null) {
          <lc-closed-spot-alert
            class="closed-spot-alert--embedded"
            [reasons]="displayReasons"
          ></lc-closed-spot-alert>
        }
      </div>
    </div>
  </hlm-popover>
</ng-container>
