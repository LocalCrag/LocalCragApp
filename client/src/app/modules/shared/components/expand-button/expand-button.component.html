@if (expanded) {
  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="icon"
    class="rounded-full"
    (click)="expanded = !expanded; expandedChange.emit(expanded)"
  >
    <ng-icon name="lucideChevronUp" />
  </button>
}
@if (!expanded) {
  <button
    hlmBtn
    type="button"
    variant="ghost"
    size="icon"
    class="rounded-full"
    (click)="expanded = !expanded; expandedChange.emit(expanded)"
  >
    <ng-icon name="lucideChevronDown" />
  </button>
}
