<div class="grid grid-cols-12">
  @for (_ of [1, 2, 3, 4, 5]; track _; let first = $first) {
    <div class="col-span-12">
      <div
        class="flex flex-col xl:flex-row xl:items-start p-6 gap-6"
        [ngClass]="{ 'border-t border-surface': !first }"
      >
        <div hlmSkeleton class="mx-auto h-32 w-9/12 sm:w-64 xl:w-40"></div>
        <div class="flex flex-col w-full xl:items-start gap-6">
          <div hlmSkeleton class="h-8 w-60"></div>
          <div hlmSkeleton class="h-16 w-full"></div>
          <div hlmSkeleton class="h-4 w-full"></div>
          <div hlmSkeleton class="h-6 w-80"></div>
          <div hlmSkeleton class="h-4 w-40"></div>
        </div>
      </div>
    </div>
  }
</div>
