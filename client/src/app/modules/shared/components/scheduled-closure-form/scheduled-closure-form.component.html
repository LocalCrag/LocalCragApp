<ng-container *transloco="let t; read: 'closableForm.closableForm'">
  <div class="flex flex-col gap-2" lcControlGroup>
    <label class="form-label">{{ t("closureSchedulesLabel") }}</label>
    <div class="flex flex-col gap-2">
      <div class="flex flex-col gap-2 mb-2">
        @for (schedule of schedules; track schedule) {
          <div class="schedule-row">
            <ng-icon name="lucideCalendar" />
            <span class="schedule-label">
              {{ t(scheduleTitleKey(schedule.scheduleType)) }}
              @if (scheduleSummary(schedule)) {
                <span class="schedule-summary">· {{ scheduleSummary(schedule) }}</span>
              }
            </span>
            <span class="schedule-actions">
              <button
                hlmBtn
                type="button"
                variant="ghost"
                size="icon-sm"
                [disabled]="isDisabled"
                (click)="configDialog.open(schedule)"
              >
                <ng-icon name="lucidePencil" />
              </button>
              <button
                hlmBtn
                type="button"
                variant="ghost"
                size="icon-sm"
                class="text-destructive"
                [disabled]="isDisabled"
                (click)="removeSchedule(schedule)"
              >
                <ng-icon name="lucideTrash" />
              </button>
            </span>
          </div>
        }
      </div>

      <button
        hlmBtn
        type="button"
        class="w-fit"
        [disabled]="isDisabled"
        (click)="configDialog.open()"
      >
        <ng-icon name="lucidePlus" />
        {{ t("addSchedule") }}
      </button>
      <lc-scheduled-closure-config-dialog
        #configDialog
        (newSchedule)="addSchedule($event)"
      />
    </div>
  </div>
</ng-container>
