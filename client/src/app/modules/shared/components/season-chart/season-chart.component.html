<ng-container *transloco="let t">
  @if (showChart) {
    <div class="lc-chart">
      <canvas lcChartJs="line" [data]="data" [options]="options"></canvas>
    </div>
  } @else {
    <div hlmAlert>
      <ng-icon name="lucideInfo" />
      <p hlmAlertDescription>{{ t("seasonChart.needsData") }}</p>
    </div>
  }
</ng-container>
