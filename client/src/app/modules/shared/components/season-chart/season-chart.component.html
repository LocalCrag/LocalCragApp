<ng-container *transloco="let t">
  @if (!seasonEmpty) {
    <div class="lc-chart relative h-72">
      <canvas lcChartJs="line" [data]="data" [options]="options"></canvas>
    </div>
  }
  @if (seasonEmpty) {
    <div hlmAlert>
      <ng-icon name="lucideInfo" />
      {{ t("noDataAvailable") }}
    </div>
  }
</ng-container>
