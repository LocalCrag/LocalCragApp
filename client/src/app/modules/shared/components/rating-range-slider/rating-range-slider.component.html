<div class="slider-container">
  <lc-slider-labels
    [rangeMin]="range[0]"
    [rangeMax]="range[1]"
    [min]="min"
    [max]="max"
    [minLabel]="'' + range[0]"
    [maxLabel]="'' + range[1]"
  />
  <hlm-slider
    [value]="sliderValue"
    (valueChange)="onRangeChange($event)"
    [min]="min"
    [max]="max"
    [disabled]="disabled"
    [step]="1"
    (pointerup)="slideEnd.emit()"
  />
</div>
