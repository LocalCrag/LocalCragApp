@if (role; as displayedRole) {
  <ng-container *transloco="let t; read: 'users.list'">
    <span
      hlmBadge
      [attr.data-cy]="dataCy"
      [variant]="badgeVariant(displayedRole.severity)"
      [class]="badgeClass(displayedRole.severity)"
      >{{ t(displayedRole.key) }}</span
    >
  </ng-container>
}
