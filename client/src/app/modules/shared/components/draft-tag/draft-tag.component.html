<ng-container *transloco="let t; read: 'draftTag'">
  <span
    hlmBadge
    variant="outline"
    class="border-transparent bg-amber-500 text-white"
    [hlmTooltip]="t('label')"
    [attr.aria-label]="t('label')"
  >
    <ng-icon name="lucidePencil" />
    <span class="spot-status-tag__label">{{ t("label") }}</span>
  </span>
</ng-container>
