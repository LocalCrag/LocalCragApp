<ng-container *transloco="let t; read: 'closedSpotAlert'">
  <div class="flex flex-col gap-2 w-full">
    @for (
      warning of warnings;
      track warning.startsOn + (warning.reason ?? "")
    ) {
      <div
        hlmAlert
        variant="warning"
        class="w-full"
      >
        <ng-icon name="lucideInfo" />
        {{ warningText(warning) }}
      </div>
    }
  </div>
</ng-container>
