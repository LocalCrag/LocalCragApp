<ng-container *transloco="let t; read: 'maps.markerList'">
  <div class="mb-2 flex flex-col gap-2">
    @for (marker of markers; track marker) {
      <div class="marker-row">
        <ng-icon name="lucideMapPin" />
        <span class="marker-label">
          {{ t(marker.type) }}
          @if (marker.name) {
            <span class="marker-name">· {{ marker.name }}</span>
          }
        </span>
        <span class="marker-actions">
          @if (marker.description) {
            <button
              hlmBtn
              type="button"
              variant="ghost"
              size="icon-sm"
              [disabled]="isDisabled"
              (click)="showDescriptionDialog($event, marker)"
            >
              <ng-icon name="lucideAlignLeft" />
            </button>
          }
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="icon-sm"
            [disabled]="isDisabled"
            (click)="configDialog.open(marker)"
            data-cy="edit-marker"
          >
            <ng-icon name="lucidePencil" />
          </button>
          <button
            hlmBtn
            type="button"
            variant="ghost"
            size="icon-sm"
            class="text-destructive"
            [disabled]="isDisabled"
            (click)="removeMarker(marker)"
            data-cy="remove-marker"
          >
            <ng-icon name="lucideTrash2" />
          </button>
        </span>
      </div>
    }
  </div>

  <button hlmBtn type="button" class="w-fit" data-cy="open-marker-config-modal" (click)="configDialog.open()" [disabled]="isDisabled"><ng-icon name="lucidePlus" /> {{ t('addMarker') }}</button>
  <lc-map-marker-config-dialog
    #configDialog
    [defaultMarkerType]="defaultMarkerType"
    (newMarker)="addMarker($event)"
    [existingMarkers]="markers"
    [disabledMarkerTypes]="disabledMarkerTypes"
  ></lc-map-marker-config-dialog>
  

<hlm-dialog
  [state]="descriptionMarker ? 'open' : 'closed'"
  (closed)="closeDescription()"
>
  <hlm-dialog-content *hlmDialogPortal class="sm:max-w-md">
    @if (descriptionMarker) {
      <div hlmDialogHeader>
        <h2 hlmDialogTitle>
          {{ descriptionMarker.name || t(descriptionMarker.type) }}
        </h2>
      </div>
      <div
        class="marker-description"
        [innerHTML]="descriptionMarker.description | sanitizeHtml"
      ></div>
    }
  </hlm-dialog-content>
</hlm-dialog>

</ng-container>
