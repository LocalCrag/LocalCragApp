<ng-container *transloco="let t; read: 'maps.mapItemInfoDialog'">
  <hlm-dialog [state]="isOpen ? 'open' : 'closed'" (closed)="isOpen = false">
    <hlm-dialog-content *hlmDialogPortal class="sm:max-w-md">
      <div hlmDialogHeader>
        <h2 hlmDialogTitle>
          {{ feature?.properties.name || t("block") }}
        </h2>
      </div>
      <div class="flex justify-end gap-2 flex-col">
        <div
          [innerHTML]="
            $safeNavigationMigration(feature?.properties.description)
          "
        ></div>
        <button hlmBtn type="button" class="w-full" (click)="navigateToItem()">
          <ng-icon name="lucideNavigation" />
          {{ t("navigateToItem") }}
        </button>
        @if (getCanOpenFeature()) {
          <button hlmBtn type="button" class="w-full" (click)="openItem()">
            <ng-icon name="lucideInfo" />
            {{ t("openItem") }}
          </button>
        }
      </div>
    </hlm-dialog-content>
  </hlm-dialog>
</ng-container>
