<ng-container *transloco="let t; read: 'linePathEditor'">
  <div
    class="sr-only"
    #anchorMenuHost
    [hlmContextMenuTrigger]="anchorMenu"
  ></div>
  <ng-template #anchorMenu>
    <div hlmDropdownMenu>
      <button
        hlmDropdownMenuItem
        type="button"
        variant="destructive"
        (triggered)="deletePendingAnchor()"
      >
        <ng-icon name="lucideTrash2" />
        {{ t("deleteAnchor") }}
      </button>
    </div>
  </ng-template>

  @if (topoImage) {
    <lc-topo-image-editor
      [topoImage]="topoImage"
      [linePathInProgress]="linePath"
      [linePathInProgressNumber]="linePathDisplayNumber"
      [drawMode]="drawMode"
      [tabuInProgress]="inProgressVertices"
      [allTabuAreas]="allTabuAreas"
      [color]="color"
      (anchorClick)="handleClick($event)"
      (anchorDrag)="handleAnchorDrag($event)"
      (anchorContextMenu)="handleAnchorContextMenu($event)"
      (lineSegmentClick)="handleLineSegmentClick($event)"
      (imageClick)="handleClick($event)"
      (closeShapeClick)="finishTabuPolygon()"
    >
    </lc-topo-image-editor>
  }

  <div class="editor-toolbar mt-2 flex flex-wrap items-center gap-2">
    <hlm-select
      class="draw-mode-select"
      [ngModel]="drawMode"
      (ngModelChange)="setDrawMode($event)"
      [disabled]="isDisabled"
      data-cy="draw-mode"
    >
      <hlm-select-trigger class="w-full">
        <ng-template hlmSelectValueTemplate let-value>
          {{ value === "tabu" ? t("drawModeTabu") : t("drawModeLine") }}
        </ng-template>
      </hlm-select-trigger>
      <hlm-select-content *hlmSelectPortal>
        @for (
          option of [
            { label: t("drawModeLine"), value: "line" },
            { label: t("drawModeTabu"), value: "tabu" },
          ];
          track option.value
        ) {
          <hlm-select-item [value]="option.value">{{
            option.label
          }}</hlm-select-item>
        }
      </hlm-select-content>
    </hlm-select>
    <button
      hlmBtn
      type="button"
      variant="secondary"
      size="sm"
      (click)="undo()"
      [disabled]="
        drawMode === 'tabu'
          ? !inProgressVertices.length
          : !linePath?.path?.length
      "
    >
      <ng-icon class="rotate-icon" name="lucideRefreshCw" />
      {{ drawMode === "tabu" ? t("undoTabu") : t("undo") }}
    </button>
    @if (drawMode === "line") {
      <button
        hlmBtn
        type="button"
        variant="secondary"
        size="sm"
        (click)="restart()"
        [disabled]="!linePath?.path?.length"
      >
        <ng-icon name="lucideTrash2" /> {{ t("restart") }}
      </button>
    }
    @if (drawMode === "tabu") {
      <button
        hlmBtn
        type="button"
        variant="secondary"
        size="sm"
        (click)="finishTabuPolygon()"
        [disabled]="!canFinishTabuPolygon()"
        data-cy="finish-tabu-area"
      >
        <ng-icon name="lucideCheck" /> {{ t("finishTabuArea") }}
      </button>
    }
  </div>
</ng-container>
