<ng-container *transloco="let t; read: 'linePath.linePathForm'">
  <div class="content p-6">
    <p class="mt-0 flex items-start">
      <span>{{ t("manageLinePathsDescription") }}</span>
      <span
        class="pi pi-question-circle ml-2 mt-1 shrink-0"
        [pTooltip]="
          (isMobile$ | async) ? t('helpDetailsMobile') : t('helpDetailsDesktop')
        "
        tooltipPosition="right"
      ></span>
    </p>

    <lc-line-path-form></lc-line-path-form>
  </div>
</ng-container>
