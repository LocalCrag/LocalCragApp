<ng-container *transloco="let t; read: 'line.line'">
  @if (removing) {
    <p class="remove-intro">{{ t("removeAscentVideoIntro") }}</p>
    <label class="message-label" for="remove-ascent-video-message">
      {{ t("removeAscentVideoMessageLabel") }}
    </label>
    <textarea
      id="remove-ascent-video-message"
      hlmTextarea
      rows="5"
      class="w-full"
      [attr.maxlength]="maxMessageLength"
      [(ngModel)]="message"
      [disabled]="saving"
      [placeholder]="t('removeAscentVideoMessagePlaceholder')"
    ></textarea>
    <small class="message-hint">{{ t("removeAscentVideoMessageHint") }}</small>
  } @else if (draft) {
    <div class="videos">
      <div class="video-row">
        <div class="video-title">{{ draft.title }}</div>
        @if (allowsStart(draft)) {
          <label>
            {{ t("videoStartLabel") }}
            <input
              hlmInput
              type="number"
              min="0"
              step="1"
              [disabled]="saving"
              [(ngModel)]="draft.startSeconds"
            />
          </label>
        }
        <button hlmBtn type="button" variant="destructive" size="sm" (click)="startRemove()" [disabled]="saving">{{ t('removeAscentVideo') }}</button>
      </div>
    </div>
  }
  @if (startInvalid) {
    <p class="error">{{ t("videoStartInvalid") }}</p>
  }
  <div class="actions">
    <button hlmBtn type="button" variant="ghost" (click)="cancel()" [disabled]="saving">{{ t('removeAscentVideoReject') }}</button>
    <button hlmBtn type="button" (click)="save()" [disabled]="saving" [variant]="removing ? 'destructive' : 'default'">@if (saving) { <ng-icon name="lucideLoaderCircle" class="animate-spin" /> } {{ removing ? t('removeAscentVideoAccept') : t('saveAscentVideos') }}</button>
  </div>
</ng-container>
