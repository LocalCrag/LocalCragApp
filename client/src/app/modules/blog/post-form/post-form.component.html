<ng-container *transloco="let t; read: 'posts.postForm'">
  <div class="content p-6">
    <form [formGroup]="postForm" lcForm>
      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="title">{{ t("postTitleLabel") }}</label>
        <input
          id="title"
          type="text"
          hlmInput
          formControlName="title"
          placeholder="{{ t('postTitlePlaceholder') }}"
          lcFormControl
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
        <small class="lc-error" *lcIfError="'maxlength'">{{
          "validation.maxLength" | transloco: { max: 120 }
        }}</small>
      </div>

      <div class="flex flex-col gap-2" lcControlGroup>
        <label class="form-label" for="text">{{ t("postTextLabel") }}</label>
        <lc-wysiwyg-editor
          id="text"
          formControlName="text"
          lcFormControl
          height="500px"
          toolbar="rich"
          [readonly]="loadingState === loadingStates.LOADING"
        />
        <small class="lc-error" *lcIfError="'required'">{{
          "validation.required" | transloco
        }}</small>
      </div>
    </form>

    <div class="form-actions">
      @if (!editMode) {
        <button
          lcLoadingButton
          icon="lucideSave"
          [loading]="loadingState === loadingStates.LOADING"
          (click)="savePost()"
          [disabled]="loadingState === loadingStates.LOADING"
          class="responsive-button"
          type="button"
        >
          {{ t("createPostButtonLabel") }}
        </button>
      }
      @if (editMode) {
        <button
          lcLoadingButton
          icon="lucideSave"
          [loading]="loadingState === loadingStates.LOADING"
          (click)="savePost()"
          [disabled]="loadingState === loadingStates.LOADING"
          class="responsive-button"
          type="button"
        >
          {{ t("editPostButtonLabel") }}
        </button>
      }
      <button
        hlmBtn
        type="button"
        variant="secondary"
        class="responsive-button"
        (click)="cancel()"
      >
        <ng-icon name="lucideBan" /> {{ t("cancelButtonLabel") }}
      </button>
      @if (editMode) {
        <button
          lcLoadingButton
          icon="lucideTrash2"
          [loading]="loadingState === loadingStates.LOADING"
          (click)="confirmDeletePost($event)"
          [disabled]="loadingState === loadingStates.LOADING"
          class="responsive-button"
          type="button"
          variant="destructive"
        >
          {{ t("deletePostButtonLabel") }}
        </button>
      }
    </div>
  </div>
</ng-container>
