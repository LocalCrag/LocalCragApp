<ng-container *transloco="let t">
  <div hlmInputGroup>
    <div hlmInputGroupAddon>
      @if (!loading) {
        <ng-icon name="lucideSearch" />
      }
      @if (loading) {
        <ng-icon name="lucideLoader2" class="animate-spin" />
      }
    </div>
    <input
      #queryInput
      hlmInputGroupInput
      type="text"
      [ngModel]="query"
      (ngModelChange)="onQueryChange($event)"
      (keydown.enter)="submit()"
      [placeholder]="t('rockExplorer.locationSearchPlaceholder')"
      [attr.aria-label]="t('rockExplorer.locationSearchGo')"
    />
    <div hlmInputGroupAddon align="inline-end">
      <button
        hlmBtn
        type="button"
        size="icon"
        variant="ghost"
        (click)="close()"
      >
        <ng-icon name="lucideX" />
      </button>
    </div>
  </div>

  @if (places.length > 0) {
    <div class="spacer"></div>
    <ul class="rock-explorer-location-search-dialog__results" role="listbox">
      @for (place of places; track place.id) {
        <li>
          <button
            type="button"
            class="rock-explorer-location-search-dialog__result"
            role="option"
            [attr.aria-selected]="false"
            (click)="selectPlace(place)"
          >
            <ng-icon name="lucideMapPin" />
            <span>{{ place.label }}</span>
          </button>
        </li>
      }
    </ul>
  }

  @if (errorMessage) {
    <div
      hlmAlert
      variant="destructive"
      class="rock-explorer-location-search-dialog__error"
    >
      <ng-icon name="lucideTriangleAlert" />
      <p hlmAlertDescription>{{ errorMessage }}</p>
    </div>
  }
</ng-container>
