<ng-container *transloco="let t; read: 'gallery.galleryForm'">
  <div class="p-6">
    <div class="flex justify-end mb-6" *isLoggedIn="true">
      <p-button
        (click)="addImage()"
        icon="pi pi-image"
        [label]="t('addImage')"
      ></p-button>
    </div>

    <div class="gallery-masonry">
      @for (column of columns; track $index) {
        <div class="gallery-masonry__column">
          @for (cell of column; track trackCell(cell)) {
            @if (cell.kind === "image") {
              <lc-gallery-image
                [image]="cell.image"
                (delete)="confirmDeleteImage($event, cell.image)"
                (edit)="editImage(cell.image)"
              ></lc-gallery-image>
            } @else {
              <lc-gallery-image-skeleton
                [aspectRatio]="cell.aspectRatio"
              ></lc-gallery-image-skeleton>
            }
          }
        </div>
      }
    </div>
    @if (hasNextPage) {
      <div class="flex justify-center mt-20">
        <p-button
          label="{{ t('loadMore') }}"
          (scrolled)="loadNextPage()"
          (click)="loadNextPage()"
          infiniteScroll
          [infiniteScrollDistance]="2"
          [infiniteScrollThrottle]="50"
          [loading]="loading === loadingStates.LOADING && currentPage > 1"
        ></p-button>
      </div>
    }
    @if (!(loading === loadingStates.LOADING) && images.length === 0) {
      <p-message severity="info" icon="pi pi-info-circle">
        {{ t("thisGalleryIsEmpty") }}
      </p-message>
    }
    <p-confirmpopup></p-confirmpopup>
  </div>
</ng-container>
