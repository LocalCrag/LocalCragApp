<ng-template #statusTags>
  @if (sector?.closed) {
    <lc-closed-spot-tag
      class="spot-status-tag--corner"
      spotType="sector"
      [slug]="sector.slug"
      [reasons]="sector.closedReasons"
      [closureIsPermanent]="sector.closureIsPermanent"
    ></lc-closed-spot-tag>
  }
  @if (sector?.secret) {
    <lc-secret-spot-tag class="spot-status-tag--corner"></lc-secret-spot-tag>
  }
</ng-template>

<div class="content">
  <router-outlet name="sectorContent"></router-outlet>
</div>
