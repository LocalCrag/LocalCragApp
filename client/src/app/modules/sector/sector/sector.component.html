<ng-template #statusTags>
  @if (sector?.closed) {
    <lc-closed-spot-tag
      class="spot-status-tag--corner"
      spotType="sector"
      [slug]="sector.slug"
      [reasons]="sector.closedReasons"
      [closureIsPermanent]="sector.closureIsPermanent"
    ></lc-closed-spot-tag>
  }
  @if (sector?.secret) {
    <lc-secret-spot-tag class="spot-status-tag--corner"></lc-secret-spot-tag>
  }
  @if (sector?.condiscore !== null && sector?.condiscore !== undefined) {
    <lc-condi-score-chip
      *isOutdoorMode="true"
      class="spot-status-tag--corner"
      [score]="sector.condiscore"
      [link]="['/topo', crag.slug, sector.slug, 'weather']"
    />
  }
</ng-template>

<div class="content">
  <router-outlet name="sectorContent"></router-outlet>
</div>
