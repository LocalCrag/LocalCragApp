<div class="p-6">
  @if (sector) {
    <lc-rules-view-meta
      entityType="Sector"
      [entityId]="sector.id"
      [rulesUpdatedAt]="sector.rulesUpdatedAt"
    ></lc-rules-view-meta>
    <section
      [innerHTML]="sector.rules | sanitizeHtml"
      class="wysiwyg-content"
    ></section>
  }

  @if (!sector) {
    <div hlmSkeleton class="h-4 w-full mb-2"></div>
    <div hlmSkeleton class="h-4 w-[90%] mb-2"></div>
    <div hlmSkeleton class="h-4 w-[87%] mb-2"></div>
    <div hlmSkeleton class="h-4 w-[70%] mb-2"></div>
    <div hlmSkeleton class="h-4 w-[65%] mb-2"></div>
    <div hlmSkeleton class="h-4 w-[45%] mb-6"></div>
    <div hlmSkeleton class="h-16 w-full mb-6"></div>
    <div hlmSkeleton class="h-16 w-[40%]"></div>
  }
</div>
