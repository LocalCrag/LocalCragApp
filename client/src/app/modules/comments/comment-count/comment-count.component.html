<ng-container *transloco="let t; read: 'commentCount'">
  <span
    hlmBadge
    variant="secondary"
    [attr.aria-label]="t('ariaLabel', { count: commentCount })"
    [class.clickable]="!!routerLink"
    (click)="onClick($event)"
  >
    <ng-icon name="lucideMessageSquare" />
    {{ displayCount }}
  </span>
</ng-container>
