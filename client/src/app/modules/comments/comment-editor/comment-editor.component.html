<ng-container *transloco="let t; read: 'comments.editor'">
  <form
    [formGroup]="form"
    lcForm
    (ngSubmit)="send()"
    class="flex gap-2 flex-col"
  >
    <div lcControlGroup class="flex flex-col gap-2">
      <textarea
        hlmTextarea
        formControlName="message"
        lcFormControl
        [placeholder]="t('writeYourComment')"
        rows="2"
        autoResize="true"
        #commentTextarea
      ></textarea>
      <small class="lc-error" *lcIfError="'maxlength'">{{
        "validation.maxLength" | transloco: { max: 10000 }
      }}</small>
    </div>

    <div class="lc-button-group justify-end">
      @if (cancelable) {
        <button
          hlmBtn
          type="button"
          variant="outline"
          [disabled]="saving"
          (click)="cancel()"
        >
          {{ t("cancel") }}
        </button>
      }
      <button
        lcLoadingButton
        [loading]="saving"
        (click)="send()"
        [disabled]="saving || form.invalid"
        type="button"
      >
        {{ t("postComment") }}
      </button>
    </div>
  </form>
</ng-container>
