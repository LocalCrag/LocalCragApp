<ng-container *transloco="let t; read: 'blocWeather'">
  <div class="p-6">
    <lc-current-conditions
      [disableDetailsLink]="true"
      [level]="level"
      [slug]="slug"
    ></lc-current-conditions>
    @if (blocWeatherConfig) {
      <iframe
        [src]="safeBlocWeatherUrl"
        width="100%"
        [height]="iframeHeight"
        style="
          border-radius: 8px;
          border: 1px solid #e5e7eb;
          margin-top: 1rem;
          margin-bottom: 1rem;
        "
      ></iframe>
      <div hlmAlert>
        <ng-icon name="lucideInfo" />
        <div hlmAlertDescription class="block">
          {{ t("blocWeatherInfo") }}<br />
          <small>{{ t("blocWeatherInfoModel") }}</small>
        </div>
      </div>
    }
    @if (!blocWeatherConfig) {
      <div
        hlmSkeleton
        style="width: 100%; border-radius: 8px"
        [style.height]="iframeHeight + 'px'"
      ></div>
    }
  </div>
</ng-container>
