<ng-container *transloco="let t">
  @if (form) {
    <hlm-dialog [state]="isOpen ? 'open' : 'closed'" (closed)="isOpen = false"><hlm-dialog-content *hlmDialogPortal class="max-h-[calc(100dvh-2rem)] overflow-y-auto sm:max-w-lg"><div hlmDialogHeader><h2 hlmDialogTitle>{{ t('blocWeather.reportConditions') }}</h2></div><form [formGroup]="form" lcForm class="flex flex-col pt-1">
        <div hlmAlert class="mb-6"><ng-icon name="lucideInfo" /><p hlmAlertDescription>{{ t("blocWeather.reportConditionsInfo") }}</p></div>

        <div class="flex flex-col gap-2" lcControlGroup>
          <label class="form-label">{{
            t("blocWeather.reportConditionsStatusLabel")
          }}</label>
          <div class="flex flex-wrap gap-2">
            <button hlmToggle type="button" class="capitalize" [state]="form.get('dry')?.value ? 'on' : 'off'" (stateChange)="form.get('dry')?.setValue($event === 'on')">{{ t('blocWeather.dry') + ' 😊' }}</button>
            <button hlmToggle type="button" class="capitalize" [state]="form.get('some_wet')?.value ? 'on' : 'off'" (stateChange)="form.get('some_wet')?.setValue($event === 'on')">{{ t('blocWeather.some_wet') + ' 😐' }}</button>
            <button hlmToggle type="button" class="capitalize" [state]="form.get('mostly_wet')?.value ? 'on' : 'off'" (stateChange)="form.get('mostly_wet')?.setValue($event === 'on')">{{ t('blocWeather.mostly_wet') + ' 😢' }}</button>
            <button hlmToggle type="button" class="capitalize" [state]="form.get('wet')?.value ? 'on' : 'off'" (stateChange)="form.get('wet')?.setValue($event === 'on')">{{ t('blocWeather.wet') + ' 😭' }}</button>
          </div>
          @if (submitted && form.errors?.noStatusSelected) {
            <small class="lc-error">{{
              "validation.required" | transloco
            }}</small>
          }
        </div>

        <div class="flex flex-col gap-2" lcControlGroup>
          <label class="form-label">{{
            t("blocWeather.reportConditionsObservedAtLabel")
          }}</label>
          <div class="flex gap-2">
            <input type="datetime-local" hlmInput formControlName="observedAt" lcFormControl class="flex-1" />
            <button hlmBtn type="button" variant="secondary" (click)="setNow()">{{ t('blocWeather.reportConditionsNow') }}</button>
          </div>
          <small class="lc-error" *lcIfError="'required'">{{
            "validation.required" | transloco
          }}</small>
        </div>

        <div class="flex flex-col gap-2" lcControlGroup>
          <label class="form-label">{{
            t("blocWeather.reportConditionsCommentLabel")
          }}</label>
          <textarea
            rows="3"
            hlmTextarea
            formControlName="comment"
            lcFormControl
            class="w-full"
            [placeholder]="t('blocWeather.reportConditionsCommentPlaceholder')"
          ></textarea>
        </div>
      </form><div hlmDialogFooter><button hlmBtn type="button" variant="secondary" (click)="close()">{{ t('blocWeather.reportConditionsCancel') }}</button>
        <button hlmBtn type="button" variant="default" [disabled]="loading" (click)="submit()">@if (loading) { <hlm-spinner /> } {{ t('blocWeather.reportConditionsSubmit') }}</button></div></hlm-dialog-content></hlm-dialog>
  }
</ng-container>
