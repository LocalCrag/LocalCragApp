<ng-template #statusTags>
  @if (crag?.closed) {
    <lc-closed-spot-tag
      class="spot-status-tag--corner"
      spotType="crag"
      [slug]="crag.slug"
      [reasons]="crag.closedReasons"
      [closureIsPermanent]="crag.closureIsPermanent"
    ></lc-closed-spot-tag>
  }
  @if (crag?.secret) {
    <lc-secret-spot-tag class="spot-status-tag--corner"></lc-secret-spot-tag>
  }
  @if (crag?.condiscore !== null && crag?.condiscore !== undefined) {
    <lc-condi-score-chip
      *isOutdoorMode="true"
      class="spot-status-tag--corner"
      [score]="crag.condiscore"
      [link]="['/topo', crag.slug, 'weather']"
    />
  }
</ng-template>

<div class="content">
  <router-outlet name="cragContent"></router-outlet>
</div>
