{{- if .Values.backups.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "localcrag.fullname" . }}-backup
  labels:
    {{- include "localcrag.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backups.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.backups.jobHistory.successful }}
  failedJobsHistoryLimit: {{ .Values.backups.jobHistory.failed }}
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "localcrag.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          {{- if .Values.backups.serviceAccountName }}
          serviceAccountName: {{ .Values.backups.serviceAccountName | quote }}
          {{- end }}
          containers:
            - name: backup
              image: {{ printf "postgres:%s" .Values.postgres.image.tag | quote }}
              imagePullPolicy: IfNotPresent
              env:
                - name: BACKUP_RETENTION_KEEP
                  value: {{ default 3 .Values.backups.retention.keep | int | quote }}

                - name: BACKUP_S3_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "BACKUP_S3_ENDPOINT" .Values.backups.target.secretKeys.endpointKey | quote }}
                - name: BACKUP_S3_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "BACKUP_S3_BUCKET" .Values.backups.target.secretKeys.bucketKey | quote }}
                - name: BACKUP_S3_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "BACKUP_S3_PREFIX" .Values.backups.target.secretKeys.prefixKey | quote }}
                      optional: true

                # Credentials for the backup destination (AWS CLI).
                - name: DST_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "BACKUP_S3_ACCESS_KEY" .Values.backups.target.secretKeys.accessKeyKey | quote }}
                - name: DST_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "BACKUP_S3_SECRET_KEY" .Values.backups.target.secretKeys.secretKeyKey | quote }}

                # Always include Postgres env
                - name: PGHOST
                  value: {{ include "localcrag.postgres.fullname" . | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: {{ .Values.postgres.auth.username | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.auth.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "POSTGRES_PASSWORD" .Values.existingSecret.keys.postgresPassword | quote }}

                # Active object-storage backend (MinIO or SeaweedFS)
                - name: SRC_ENDPOINT
                  value: {{ printf "http://%s:%s" (include "localcrag.s3.fullname" .) (include "localcrag.s3.port" .) | quote }}
                - name: SRC_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "rootUser" .Values.existingSecret.keys.s3User | quote }}
                - name: SRC_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "localcrag.secrets.name" . | quote }}
                      key: {{ default "rootPassword" .Values.existingSecret.keys.s3Password | quote }}
                - name: SRC_BUCKET
                  value: {{ .Values.appS3.bucket | quote }}

                # AWS CLI settings for S3-compatible endpoints (MinIO / SeaweedFS / backup target).
                - name: AWS_DEFAULT_REGION
                  value: "eu-central-1"
                - name: AWS_EC2_METADATA_DISABLED
                  value: "true"
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: WHEN_REQUIRED
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: WHEN_REQUIRED

              command:
                - /bin/sh
                - -lc
                - |
                  set -euo pipefail

                  # Validate all required variables
                  : "${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required}"
                  : "${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}"
                  : "${BACKUP_S3_PREFIX:?BACKUP_S3_PREFIX is required.}"
                  : "${DST_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY is required}"
                  : "${DST_SECRET_KEY:?BACKUP_S3_SECRET_KEY is required}"
                  : "${BACKUP_RETENTION_KEEP:?BACKUP_RETENTION_KEEP is required}"
                  : "${PGHOST:?PGHOST is required}"
                  : "${PGPORT:?PGPORT is required}"
                  : "${PGUSER:?PGUSER is required}"
                  : "${PGDATABASE:?PGDATABASE is required}"
                  : "${PGPASSWORD:?PGPASSWORD is required}"
                  : "${SRC_BUCKET:?SRC_BUCKET is required}"

                  # Normalize prefix (remove leading/trailing slashes)
                  PREFIX="${BACKUP_S3_PREFIX#/}"
                  PREFIX="${PREFIX%/}"

                  echo "Backup target endpoint: ${BACKUP_S3_ENDPOINT}"
                  echo "Backup target bucket: ${BACKUP_S3_BUCKET}"
                  echo "Backup target prefix: ${PREFIX}"

                  TS="$(date -u +%Y%m%dT%H%M%SZ)"

                  # Ensure required tools are available (postgres image is Debian-based)
                  export DEBIAN_FRONTEND=noninteractive
                  apt-get update -y
                  apt-get install -y --no-install-recommends ca-certificates coreutils
                  apt-get install -y --no-install-recommends awscli || apt-get install -y --no-install-recommends aws-cli
                  rm -rf /var/lib/apt/lists/*

                  DST_ENDPOINT="${BACKUP_S3_ENDPOINT}"

                  # Path-style addressing matches LocalCrag S3_ADDRESSING=path
                  mkdir -p /tmp/aws
                  cat > /tmp/aws/config <<'EOF'
                  [default]
                  region = eu-central-1
                  s3 =
                      addressing_style = path
                      signature_version = s3v4
                  EOF
                  export AWS_CONFIG_FILE=/tmp/aws/config

                  aws_s3() {
                    endpoint="$1"; access="$2"; secret="$3"; shift 3
                    AWS_ACCESS_KEY_ID="${access}" AWS_SECRET_ACCESS_KEY="${secret}" \
                      aws --endpoint-url "${endpoint}" "$@"
                  }

                  echo "--- Bundled backup snapshot: ${TS} ---"

                  # ---- Postgres dump -> destination snapshot dir ----
                  FILE="/tmp/${PGDATABASE}_${TS}.sql.gz"
                  echo "Dumping database '${PGDATABASE}' from ${PGHOST}:${PGPORT}..."
                  pg_dump --format=plain --no-owner --no-privileges "${PGDATABASE}" | gzip -9 > "${FILE}"

                  PG_DST="s3://${BACKUP_S3_BUCKET}/${PREFIX}/${TS}/postgres/${PGDATABASE}.sql.gz"
                  echo "Uploading Postgres to ${PG_DST}..."
                  aws_s3 "${DST_ENDPOINT}" "${DST_ACCESS_KEY}" "${DST_SECRET_KEY}" s3 cp "${FILE}" "${PG_DST}"

                  # ---- Object storage sync -> same snapshot dir ----
                  # Keep the historical "minio/" prefix so existing backup layouts still restore.
                  OBJ_DST="s3://${BACKUP_S3_BUCKET}/${PREFIX}/${TS}/minio/${SRC_BUCKET}"
                  SYNC_DIR="/tmp/s3-sync"
                  rm -rf "${SYNC_DIR}"
                  mkdir -p "${SYNC_DIR}"
                  echo "Syncing s3://${SRC_BUCKET} from ${SRC_ENDPOINT} -> ${OBJ_DST} ..."
                  aws_s3 "${SRC_ENDPOINT}" "${SRC_ACCESS_KEY}" "${SRC_SECRET_KEY}" s3 sync "s3://${SRC_BUCKET}" "${SYNC_DIR}"
                  aws_s3 "${DST_ENDPOINT}" "${DST_ACCESS_KEY}" "${DST_SECRET_KEY}" s3 sync "${SYNC_DIR}" "${OBJ_DST}"
                  rm -rf "${SYNC_DIR}"

                  # ---- Retention (snapshot-level) ----
                  echo "Applying bundled retention (keep=${BACKUP_RETENTION_KEEP}) under s3://${BACKUP_S3_BUCKET}/${PREFIX}/"

                  RETENTION_URI="s3://${BACKUP_S3_BUCKET}/${PREFIX}"

                  # List all snapshot directories. aws s3 ls prints prefixes as: PRE <name>/
                  # Parse output to get just directory names (last column, remove trailing /)
                  aws_s3 "${DST_ENDPOINT}" "${DST_ACCESS_KEY}" "${DST_SECRET_KEY}" \
                    s3 ls "${RETENTION_URI}/" 2>/dev/null | awk '{print $NF}' | grep '/$' | sed 's:/$::' | sort > /tmp/snapshots.txt || true

                  # Debug: show what we found
                  if [ -s /tmp/snapshots.txt ]; then
                    echo "DEBUG: Snapshot directories found:"
                    cat /tmp/snapshots.txt
                  else
                    echo "DEBUG: No directories found. Raw aws s3 ls output:"
                    aws_s3 "${DST_ENDPOINT}" "${DST_ACCESS_KEY}" "${DST_SECRET_KEY}" s3 ls "${RETENTION_URI}/" 2>&1 || echo "(aws s3 ls failed)"
                  fi

                  if [ ! -s /tmp/snapshots.txt ]; then
                    echo "No existing snapshots found."
                  else
                    SNAPSHOT_COUNT=$(wc -l < /tmp/snapshots.txt | tr -d ' ')
                    echo "Found ${SNAPSHOT_COUNT} snapshot(s)."

                    if [ "${SNAPSHOT_COUNT}" -gt "${BACKUP_RETENTION_KEEP}" ]; then
                      DELETE_COUNT=$((SNAPSHOT_COUNT - BACKUP_RETENTION_KEEP))
                      echo "Will delete ${DELETE_COUNT} old snapshot(s)."

                      # Delete the oldest snapshots (first N lines after sorting)
                      head -n "${DELETE_COUNT}" /tmp/snapshots.txt | while IFS= read -r old; do
                        [ -z "${old}" ] && continue
                        echo "Deleting old bundled snapshot: ${old}"
                        aws_s3 "${DST_ENDPOINT}" "${DST_ACCESS_KEY}" "${DST_SECRET_KEY}" s3 rm "${RETENTION_URI}/${old}/" --recursive
                      done
                    else
                      echo "Retention threshold not exceeded (keeping all ${SNAPSHOT_COUNT} snapshots)."
                    fi
                  fi

                  rm -f /tmp/snapshots.txt

                  echo "Bundled backup complete."
              resources:
                {{- toYaml .Values.backups.resources | nindent 16 }}
{{- end }}
