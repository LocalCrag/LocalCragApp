postgres:
  image:
    tag: "17.7"
  auth:
    username: localcrag
    database: localcrag
    # REQUIRED: Provide Postgres password via an existing Kubernetes Secret (normally the same as `existingSecret.name`).
    existingSecret: ""
    secretKeys:
      adminPasswordKey: POSTGRES_PASSWORD
  resources:
    requests:
      cpu: 500m
      memory: 500Mi
    limits:
      memory: 1Gi

existingSecret:
  # REQUIRED: Name of the Kubernetes Secret containing credentials
  # This secret contains credentials for the main application
  # Example: localcrag-secrets (or <release>-secrets pattern)
  name: ""
  keys: {}

server:
  image:
    repository: ghcr.io/localcrag/localcrag-server
    tag: 1.57.0
    pullPolicy: Always
  # REQUIRED: The public URL of your frontend (with trailing slash).
  # Example: "https://localcrag.example.com/"
  frontendHost: ""
  # Application log level (DEBUG, INFO, WARNING, ERROR). Logs go to stdout for kubectl logs.
  logLevel: INFO
  # Optional Sentry error tracking (server + client). When enabled, sentryDsn is required.
  # Disabled by default (env var omitted so the app default False applies).
  sentryEnabled: false
  sentryDsn: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

# S3 settings used by the LocalCrag server application
appS3:
  bucket: localcrag
  # REQUIRED: Public URL for accessing S3 objects (e.g., "https://s3.example.com")
  accessEndpoint: ""
  addressing: path

# Object storage (S3-compatible). This chart version always deploys MinIO
# (same as before) plus SeaweedFS so you can copy data and switch backends.
# A future chart release will drop MinIO entirely.
s3:
  # Active backend used by the LocalCrag server, backups, and S3 ingress.
  # "minio" | "seaweedfs" — default stays minio so existing releases keep serving
  # from the current PVC. Set seaweedfs after copying objects (see MIGRATION-MINIO-SEAWEEDFS.md).
  backend: minio

  # REQUIRED: Hosts for the S3 endpoints exposed via Ingress
  ingress:
    # Public hostname for S3 API access (e.g., "s3.example.com")
    s3Host: ""
    # Public hostname for the storage console (SeaweedFS filer UI, or MinIO console)
    consoleHost: ""

  # REQUIRED: Secret containing S3 credentials (normally the same as `existingSecret.name`).
  # Keys default to MinIO-compatible rootUser / rootPassword.
  existingSecret: ""

  seaweedfs:
    image:
      repository: chrislusf/seaweedfs
      tag: "4.45"
      pullPolicy: IfNotPresent
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        memory: 1Gi

  migration:
    # When true, run a Helm hook Job that mirrors appS3.bucket from MinIO to SeaweedFS.
    enabled: false
    image:
      repository: alpine
      tag: "3.21"
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

  # MinIO subchart configuration (always installed in this chart version)
  buckets:
    - name: localcrag
      policy: download
      purge: false
      versioning: false

  mode: standalone

  persistence:
    enabled: true
    size: 10Gi

  service:
    type: ClusterIP
    port: 9000

  consoleService:
    type: ClusterIP
    port: 9001

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi

# REQUIRED: SMTP configuration for sending emails
smtp:
  # SMTP server hostname (e.g., "smtp.gmail.com")
  host: ""
  # SMTP server port (e.g., "587" for STARTTLS, "465" for SSL)
  port: ""
  # Connection type: "starttls", "ssl", or "plain"
  type: ""

# REQUIRED: Email address used as the sender for system emails
# Example: "noreply@example.com"
systemEmail: ""

client:
  image:
    repository: ghcr.io/localcrag/localcrag-client
    tag: 1.57.0
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  ingress:
    # REQUIRED: The public hostname for the application (e.g., "localcrag.example.com")
    host: ""
    path: /

    # REQUIRED: cert-manager ClusterIssuer name for TLS certificates
    # Example: "letsencrypt-prod" or "letsencrypt-staging"
    clusterIssuer: ""


# Scheduled backups for Postgres and object storage.
#
# This creates a single CronJob that backs up both the database and files together.
# The backup container uses the postgres image (includes pg_dump) and installs the AWS CLI at runtime.
# Set backups.enabled=true to enable backups, backups.enabled=false to disable.
# You must provide S3 credentials in your Secret (see README for required keys).
backups:
  enabled: true

  # Combined backup schedule (single CronJob / single Pod).
  schedule: "0 2 * * *"

  # Resources for the combined backup container.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  # S3 backup destination configuration.
  # The backup CronJob reads destination credentials from `existingSecret.name`.
  # You can customize the secret key names here.
  target:
    secretKeys:
      endpointKey: BACKUP_S3_ENDPOINT
      bucketKey: BACKUP_S3_BUCKET
      prefixKey: BACKUP_S3_PREFIX
      accessKeyKey: BACKUP_S3_ACCESS_KEY
      secretKeyKey: BACKUP_S3_SECRET_KEY

  jobHistory:
    successful: 1
    failed: 1

  # Optional: run backups under a specific service account.
  serviceAccountName: ""

  # How many backup snapshots to keep under the prefix.
  # Oldest snapshots are deleted when exceeding this limit.
  retention:
    keep: 3
