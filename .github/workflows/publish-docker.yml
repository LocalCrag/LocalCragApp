name: Publish Docker Images
run-name: Publish Docker Images 🚢

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  push:
    branches:
      - next

jobs:

  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    if: >
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Extract version from package.json
        id: get-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push client Docker image
        run: |
          IMAGE_NAME=ghcr.io/localcrag/localcrag-client
          cd client
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            TAG=$VERSION
            docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest -f Dockerfile .
            docker push $IMAGE_NAME:$TAG
            docker push $IMAGE_NAME:latest
          else
            TAG=next
            docker build -t $IMAGE_NAME:$TAG -f Dockerfile .
            docker push $IMAGE_NAME:$TAG
          fi

      - name: Build and push server Docker image
        run: |
          IMAGE_NAME=ghcr.io/localcrag/localcrag-server
          cd server
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            TAG=$VERSION
            docker build -t $IMAGE_NAME:$TAG -t $IMAGE_NAME:latest -f Dockerfile .
            docker push $IMAGE_NAME:$TAG
            docker push $IMAGE_NAME:latest
          else
            TAG=next
            docker build -t $IMAGE_NAME:$TAG -f Dockerfile .
            docker push $IMAGE_NAME:$TAG
          fi

      - name: Build and push backup Docker image
        run: |
          IMAGE_NAME=ghcr.io/localcrag/localcrag-backup
          POSTGRES_TAG=$(awk '
            /^postgres:/ { in_pg=1; next }
            in_pg && /^[^ ]/ { exit }
            in_pg && /^  image:/ { in_img=1; next }
            in_img && /^  [^ ]/ { exit }
            in_img && /tag:/ {
              gsub(/"/, "", $2)
              print $2
              exit
            }
          ' helm/localcrag/values.yaml)
          if [ -z "$POSTGRES_TAG" ]; then
            echo "Could not read postgres.image.tag from helm/localcrag/values.yaml"
            exit 1
          fi
          echo "Building backup image from postgres:${POSTGRES_TAG}"
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            TAG=$VERSION
            docker build \
              --build-arg POSTGRES_TAG="$POSTGRES_TAG" \
              -t $IMAGE_NAME:$TAG \
              -t $IMAGE_NAME:latest \
              -t $IMAGE_NAME:$POSTGRES_TAG \
              -f backup/Dockerfile \
              backup
            docker push $IMAGE_NAME:$TAG
            docker push $IMAGE_NAME:latest
            docker push $IMAGE_NAME:$POSTGRES_TAG
          else
            TAG=next
            docker build \
              --build-arg POSTGRES_TAG="$POSTGRES_TAG" \
              -t $IMAGE_NAME:$TAG \
              -f backup/Dockerfile \
              backup
            docker push $IMAGE_NAME:$TAG
          fi
