name: Auto-approve PR
run-name: Auto-approve PR by dorthrithil 🤖

on:
  pull_request:
    types: [ opened, synchronize ]

jobs:
  auto-approve:
    # Only for same-repo PRs by dorthrithil (fork PRs have no bot secrets)
    if: >
      github.actor == 'dorthrithil' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.BOT_APP_ID }}
          private_key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Auto-approve
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ steps.generate_token.outputs.token }}

  skip:
    # Ensure contributor / fork PRs get a green check instead of an empty failed run
    if: >
      github.actor != 'dorthrithil' ||
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Skip auto-approve
        run: echo "Auto-approve skipped (not an eligible same-repo PR)."
