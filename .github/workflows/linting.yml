name: Linting Pipeline
run-name: Linting 🔍

on:
  pull_request:
    branches:
      - main
      - next
jobs:
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.14

      - name: Install dependencies
        run: |
          pip install pipenv
          cd server
          pipenv install --dev

      - name: Run Flake8
        run: |
          cd server
          pipenv run flake8 .

      - name: Run Black
        run: |
          cd server
          pipenv run black --check .

      - name: Run Isort
        run: |
          cd server
          pipenv run isort --check-only .
  lint-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd client
          npm ci

      - name: Run ESLint
        run: |
          cd client
          npm run lint

      - name: Run Prettier
        run: |
          cd client
          npx prettier --check .

  lint-helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # charts/ is gitignored, so subcharts are fetched from Chart.lock.
      # This also fails if Chart.lock drifts out of sync with Chart.yaml.
      - name: Fetch chart dependencies
        run: |
          helm repo add minio https://charts.min.io/
          helm dependency build helm/localcrag

      # values.yaml alone cannot satisfy values.schema.json (required fields
      # ship empty), so every fixture in ci/ is linted and rendered instead.
      - name: Run Helm Lint
        run: |
          for values in helm/localcrag/ci/*-values.yaml; do
            echo "::group::helm lint ($values)"
            helm lint helm/localcrag --strict -f "$values"
            echo "::endgroup::"
          done

      - name: Render manifests
        run: |
          for values in helm/localcrag/ci/*-values.yaml; do
            echo "::group::helm template ($values)"
            helm template localcrag helm/localcrag -f "$values" > /dev/null
            echo "::endgroup::"
          done