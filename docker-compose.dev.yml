services:
  database:
    image: postgres
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: localcrag
      POSTGRES_DB: localcrag
      POSTGRES_PASSWORD: password

  # The "anonymous" identity keeps uploaded files publicly readable, which is
  # what `mc anonymous set public` did under MinIO.
  storage_config:
    image: busybox:1.36
    volumes:
      - storage_config:/config
    command:
      - sh
      - "-c"
      - |
        printf '%s\n' '{"identities":[{"name":"anonymous","actions":["Read"]},{"name":"localcrag","credentials":[{"accessKey":"localcrag","secretKey":"password"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /config/s3.json

  storage:
    image: chrislusf/seaweedfs:4.45
    depends_on:
      storage_config:
        condition: service_completed_successfully
    environment:
      S3_BUCKET: localcrag  # weed mini pre-creates this bucket on startup
    volumes:
      - storage:/data
      - storage_config:/config:ro
    ports:
      - "127.0.0.1:8333:8333"  # Stored Files
      - "127.0.0.1:8888:8888"  # Web UI
    command: ["mini", "-dir=/data", "-s3.config=/config/s3.json"]

  mails:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:8025:8025"  # Web UI

  database_web:
    image: michalhosna/adminer
    ports:
      - "127.0.0.1:8080:8080"  # Web UI
    environment:
      ADMINER_DB: localcrag
      ADMINER_DRIVER: pgsql
      ADMINER_USERNAME: localcrag
      ADMINER_PASSWORD: password
      ADMINER_SERVER: database
      ADMINER_AUTOLOGIN: 1

  server:
    build:
      target: localcragapp-server
    depends_on:
      - database
      - mails
      - storage
    ports:
      - "127.0.0.1:5000:5000"  # API Server
    environment:
      SQLALCHEMY_DATABASE_URI: "postgresql://localcrag:password@database/localcrag"
      LOCALCRAG_CONFIG: /localcragapp/src/config/dev.cfg
      S3_USER: localcrag
      S3_PASSWORD: password
      S3_ENDPOINT: http://storage:8333
      S3_BUCKET: localcrag
      S3_ACCESS_ENDPOINT: http://localhost:8333
      S3_ADDRESSING: path
      SMTP_HOST: mails
      SMTP_PORT: 1025
      SMTP_TYPE: plain
      FLASK_DEBUG: 1
      DOCKER: 1
      SECRET_KEY: dev-key
      SESSION_COOKIE_SECURE: "false"
    volumes:
      - ./server/src:/localcragapp/src
      - ./server/tests:/localcragapp/tests
    command:
      - sh
      - "-c"
      - "pipenv run flask db upgrade && pipenv run python util/scripts/database_setup.py && pipenv run flask run --host=0.0.0.0"

  client:
    build:
      target: localcragapp-client
    volumes:
      - ./client/src:/localcragapp/src
      - ./client/package.json:/localcragapp/package.json
    ports:
      - "127.0.0.1:4200:4200"  # Web Frontend
    command:
      - sh
      - "-c"
      - "npm run tw:build && npx concurrently -k -n tw,ng \"npm run tw:watch\" \"npx ng serve --host 0.0.0.0 --hmr\""

volumes:
  database:
  storage:
  storage_config:
